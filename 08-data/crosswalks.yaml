      - {code: K, title: Law, mapping: close-field, targets: [D09]}
      - {code: L, title: Education, mapping: close-field, targets: [D16]}
      - {code: M, title: Music and Books on Music, mapping: close-field, targets: [D18]}
      - {code: N, title: Fine Arts, mapping: close-field, targets: [D18]}
      - {code: P, title: Language and Literature, mapping: composite-field, targets: [D11, D18]}
      - {code: Q, title: Science, mapping: composite-field, targets: [D02, D03, D04, D05, D12]}
      - {code: R, title: Medicine, mapping: close-field, targets: [D14]}
      - {code: S, title: Agriculture, mapping: close-field, targets: [D15]}
      - {code: T, title: Technology, mapping: composite-field, targets: [D12, D13]}
