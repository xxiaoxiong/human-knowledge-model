schema_version: 0.1.0
model_version: 0.2.0
description: 外部分类到 HKM H2 的有损映射。targets 表示导航或知识调用，不表示概念等价。

mapping_semantics:
  close-field: 外部类别与一个 HKM 领域核心范围近似，但边界不完全相同。
  composite-field: 外部类别把多个 HKM 领域合并在一起。
  navigation-to-knowledge: 馆藏或内容导航类别到可能知识入口的映射。
  curriculum-to-knowledge: 教育项目类别到其主要知识与实践领域的映射。
  activity-to-knowledge: 经济活动需要调用的知识领域，不表示该活动是一种知识。
  occupation-to-knowledge: 职业组需要的知识与技能领域，不表示职业等于领域。

systems:
  - id: isced-f-2013
    title: UNESCO ISCED Fields of Education and Training 2013
    purpose: 教育项目和资格的国际统计分类
    source: https://uis.unesco.org/sites/default/files/documents/isced-fields-of-education-and-training-2013-en.pdf
    mapping_level: broad-field
    categories:
      - {code: '00', title: Generic programmes and qualifications, mapping: curriculum-to-knowledge, targets: [D02, D11, D16, D20], note: 通识和个人能力项目按实际内容分流，不建立“通用知识”杂项域。}
      - {code: '01', title: Education, mapping: close-field, targets: [D16]}
      - {code: '02', title: Arts and humanities, mapping: composite-field, targets: [D01, D08, D11, D18, D19]}
      - {code: '03', title: Social sciences, journalism and information, mapping: composite-field, targets: [D06, D07, D10, D11]}
      - {code: '04', title: Business, administration and law, mapping: composite-field, targets: [D09, D10]}
      - {code: '05', title: Natural sciences, mathematics and statistics, mapping: composite-field, targets: [D02, D03, D04, D05]}
      - {code: '06', title: Information and Communication Technologies, mapping: close-field, targets: [D12]}
      - {code: '07', title: Engineering, manufacturing and construction, mapping: composite-field, targets: [D13]}
      - {code: '08', title: Agriculture, forestry, fisheries and veterinary, mapping: close-field, targets: [D15]}
      - {code: '09', title: Health and welfare, mapping: composite-field, targets: [D07, D14, D20], note: Welfare 不等同医学，需连社会服务与照护实践。}
      - {code: '10', title: Services, mapping: composite-field, targets: [D10, D13, D17, D20], note: 体育、家政、旅游、安保和运输按实际对象与技能分流。}

