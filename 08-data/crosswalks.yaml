architecture_only_sources:
  - id: mediawiki-categories
    title: MediaWiki Categories
    source: https://www.mediawiki.org/wiki/Help:Categories
    lesson: 类别结构实际常为多父图；HKM 借鉴多重归属，但增加严格关系语义。
  - id: skos
    title: W3C Simple Knowledge Organization System
    source: https://www.w3.org/TR/skos-reference/
    lesson: 借鉴概念方案、标签、broader/narrower/related 与映射；HKM 另扩展证据、因果、实现和学习关系。
