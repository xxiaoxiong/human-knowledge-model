      - {code: '400', title: Language, mapping: close-field, targets: [D11]}
      - {code: '500', title: Science, mapping: composite-field, targets: [D02, D03, D04, D05]}
      - {code: '600', title: Technology, mapping: composite-field, targets: [D12, D13, D14, D15]}
      - {code: '700', title: Arts and recreation, mapping: composite-field, targets: [D18, D20]}
      - {code: '800', title: Literature, mapping: close-field, targets: [D18]}
