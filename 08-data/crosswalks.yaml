      - {code: '2', title: Engineering and technology, mapping: close-field, targets: [D13], note: FORD 将计算的一部分放在自然科学，医学/环境/生物技术又与其他域桥接。}
      - {code: '3', title: Medical and health sciences, mapping: close-field, targets: [D14]}
      - {code: '4', title: Agricultural and veterinary sciences, mapping: close-field, targets: [D15]}
      - {code: '5', title: Social sciences, mapping: composite-field, targets: [D06, D07, D09, D10, D11, D16]}
      - {code: '6', title: Humanities and the arts, mapping: composite-field, targets: [D01, D08, D11, D18, D19]}

