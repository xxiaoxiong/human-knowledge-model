schema_version: 0.1.0
model_version: 0.2.0
description: 经 Phase 2b 覆盖、边界、桥接和实践审计冻结的 H3 子领域集。

defaults: &subdomain_defaults
  primary_type: subdomain
  level: H3
  status: active
  version: 0.2.0

subdomains:
  # D01 元知识、哲学与探究
  - <<: *subdomain_defaults
    id: hkm:subdomain:epistemology-knowledge
    code: D01.01
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 认识论与知识, en: Epistemology and Knowledge}
    definition: 研究知识、证成、怀疑、可靠性、理解与认识不公。
    core_questions: [什么使信念成为有理由的知识]
    scope_includes: [knowledge, justification, skepticism, testimony, epistemic-injustice]
    boundary_notes: 具体证据标准由对象领域细化；心理信念机制归 D06。
    bridge_domains: [D06, D07, D11, D16]
    epistemic_modes: [formal, interpretive, normative]
  - <<: *subdomain_defaults
    id: hkm:subdomain:metaphysics-ontology
    code: D01.02
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 形而上学与本体论, en: Metaphysics and Ontology}
    definition: 研究存在、同一性、因果、可能性、时间与实体类别的基本结构。
    core_questions: [世界最一般的存在结构和类别是什么]
    scope_includes: [existence, identity, causation, modality, time, categories]
    boundary_notes: 经验对象是否存在仍需相应科学和历史证据。
    bridge_domains: [D02, D03, D05, D06, D12, D19]
    epistemic_modes: [formal, interpretive]
  - <<: *subdomain_defaults
    id: hkm:subdomain:argumentation-critical-inquiry
    code: D01.03
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 论证、批判性思维与探究, en: Argumentation, Critical Thinking and Inquiry}
    definition: 研究非形式论证、解释竞争、谬误、对话规范与理性探究实践。
    core_questions: [怎样比较理由并避免在论证中误导自己和他人]
    scope_includes: [argumentation, fallacies, dialogue, critical-thinking, abductive-reasoning]
    boundary_notes: 形式有效性归 D02；传播操纵的媒介机制连接 D11。
    bridge_domains: [D02, D06, D11, D16]
    epistemic_modes: [formal, interpretive, normative]
  - <<: *subdomain_defaults
    id: hkm:subdomain:ethics-moral-philosophy
    code: D01.04
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 伦理学与道德哲学, en: Ethics and Moral Philosophy}
    definition: 研究行动、品格、责任、权利、伤害、公正与道德判断。
    core_questions: [在价值冲突和不确定性下什么行动是可辩护的]
    scope_includes: [normative-ethics, metaethics, applied-ethics, responsibility, justice]
    boundary_notes: 具体职业伦理与制度规则保留应用领域主归属。
    bridge_domains: [D06, D07, D09, D12, D14, D17, D19]
    epistemic_modes: [normative, interpretive, comparative]
  - <<: *subdomain_defaults
    id: hkm:subdomain:value-aesthetics-life-philosophy
    code: D01.05
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 价值论、审美与生活哲学, en: Value Theory, Aesthetics and Philosophy of Life}
    definition: 研究价值、福祉、意义、审美经验与何为值得追求的生活。
    core_questions: [什么使事物有价值且怎样比较不可通约的价值]
    scope_includes: [value, wellbeing, meaning, aesthetics, philosophy-of-life]
    boundary_notes: 作品创作与艺术史归 D18；宗教性意义实践归 D19。
    bridge_domains: [D14, D18, D19, D20]
    epistemic_modes: [normative, interpretive]
  - <<: *subdomain_defaults
    id: hkm:subdomain:philosophy-science-technology-methodology
    code: D01.06
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 科学技术哲学与方法论, en: Philosophy of Science, Technology and Methodology}
    definition: 研究科学解释、理论变化、测量、模型、证据、技术与方法边界。
    core_questions: [模型和证据在什么条件下支持解释与可靠干预]
    scope_includes: [scientific-explanation, theory-change, measurement, models, technology-philosophy]
    boundary_notes: 具体研究方法归相应对象领域和方法节点。
    bridge_domains: [D02, D03, D07, D12, D13, D14]
    epistemic_modes: [formal, historical, interpretive, normative]
  - <<: *subdomain_defaults
    id: hkm:subdomain:philosophy-mind-language
    code: D01.07
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 心灵与语言哲学, en: Philosophy of Mind and Language}
    definition: 研究意识、意向性、心身关系、意义、指称与理解的概念基础。
    core_questions: [心智状态与语言意义怎样可能并如何相互关联]
    scope_includes: [consciousness, intentionality, mind-body, meaning, reference]
    boundary_notes: 心理和神经机制归 D06；语言结构和使用归 D11。
    bridge_domains: [D06, D11, D12]
    epistemic_modes: [formal, interpretive]
  - <<: *subdomain_defaults
    id: hkm:subdomain:social-political-legal-philosophy
    code: D01.08
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 社会、政治与法律哲学, en: Social, Political and Legal Philosophy}
    definition: 研究自由、平等、权力、合法性、权利、法律义务与社会正义。
    core_questions: [共同生活的规则和权力怎样获得正当性]
    scope_includes: [freedom, equality, legitimacy, rights, legal-obligation, justice]
    boundary_notes: 制度运行和法解释归 D09；社会结构经验研究归 D07。
    bridge_domains: [D07, D09, D10, D17]
    epistemic_modes: [normative, interpretive, historical]
  - <<: *subdomain_defaults
    id: hkm:subdomain:comparative-philosophy-knowledge-traditions
    code: D01.09
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 比较哲学与知识传统, en: Comparative Philosophy and Knowledge Traditions}
    definition: 比较不同文明、地方与原住民传统中的存在论、认识论、伦理和实践智慧。
    core_questions: [怎样在不抹平语境和权力差异的前提下比较知识传统]
    scope_includes: [comparative-philosophy, indigenous-knowledge, local-knowledge, traditions, decolonial-epistemology]
    boundary_notes: 传统不是同质整体；具体历史、宗教和实践分别连接 D08/D19/D20。
    bridge_domains: [D07, D08, D15, D19, D20]
    epistemic_modes: [comparative, historical, interpretive, normative]
  - <<: *subdomain_defaults
    id: hkm:subdomain:metascience-research-integrity
    code: D01.10
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 元科学与研究诚信, en: Metascience and Research Integrity}
    definition: 经验研究知识生产、复现、发表、同行评议、激励、偏差与诚信制度。
    core_questions: [知识生产制度怎样提高或削弱研究可靠性]
    scope_includes: [reproducibility, peer-review, publication-bias, research-ethics, science-of-science]
    boundary_notes: 不是对具体领域结论的替代审查，而是研究其生产与纠错机制。
    bridge_domains: [D02, D07, D09, D10, D11, D16]
    epistemic_modes: [empirical, causal, historical, normative, synthetic]
  - <<: *subdomain_defaults
    id: hkm:subdomain:knowledge-organization-ontology
    code: D01.11
    parent: hkm:domain:metaknowledge-philosophy-inquiry
    labels: {zh: 知识组织、本体与分类, en: Knowledge Organization, Ontology and Classification}
    definition: 研究概念、术语、分类、本体、知识图谱及其语义和社会后果。
    core_questions: [怎样组织知识而不把导航便利误当成世界的唯一结构]
    scope_includes: [taxonomy, ontology-engineering, terminology, knowledge-graphs, classification]
    boundary_notes: 图书档案实践连接 D11；计算实现连接 D12。
    bridge_domains: [D11, D12, D16]
    epistemic_modes: [formal, interpretive, design]

  # D02 数学、统计与形式系统
  - <<: *subdomain_defaults
    id: hkm:subdomain:foundations-sets-types-categories
    code: D02.01
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 数学基础、集合、类型与范畴, en: Mathematical Foundations, Sets, Types and Categories}
    definition: 研究数学对象、基础体系以及结构和映射的一般语言。
    core_questions: [数学对象和结构可以由哪些基础体系一致表达]
    scope_includes: [set-theory, type-theory, category-theory, foundations]
    boundary_notes: 计算系统中的类型实现归 D12。
    bridge_domains: [D01, D12]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:mathematical-logic-proof
    code: D02.02
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 数理逻辑、证明与模型, en: Mathematical Logic, Proof and Model Theory}
    definition: 研究形式语言、可证明性、模型、可判定性和逻辑系统。
    core_questions: [哪些陈述可在给定形式系统中证明或决定]
    scope_includes: [proof-theory, model-theory, computability, modal-logic, formal-semantics]
    boundary_notes: 日常论证和谬误归 D01；程序验证连接 D12。
    bridge_domains: [D01, D11, D12]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:number-theory-arithmetic
    code: D02.03
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 数论与算术结构, en: Number Theory and Arithmetic Structures}
    definition: 研究整数、素数、丢番图关系和数的代数与解析结构。
    core_questions: [整数及其关系具有哪些深层结构]
    scope_includes: [integers, primes, diophantine-equations, analytic-number-theory]
    boundary_notes: 密码系统的工程部署归 D12。
    bridge_domains: [D12]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:algebra-discrete-structures
    code: D02.04
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 代数与离散结构, en: Algebra and Discrete Structures}
    definition: 研究群、环、域、线性结构、组合对象、图与离散关系。
    core_questions: [运算和离散关系的不变量与结构是什么]
    scope_includes: [algebra, linear-algebra, combinatorics, graph-theory, discrete-mathematics]
    boundary_notes: 现实网络的机制归对象领域，形式结构保留本域。
    bridge_domains: [D03, D05, D07, D12]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:geometry-topology
    code: D02.05
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 几何与拓扑, en: Geometry and Topology}
    definition: 研究空间、形状、度量、连续性、连通性和不变量。
    core_questions: [空间结构在变换下保留哪些性质]
    scope_includes: [geometry, topology, manifolds, metric-spaces, spatial-structure]
    boundary_notes: 物理时空解释归 D03；空间测绘应用连接 D04。
    bridge_domains: [D03, D04, D12, D13]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:analysis-calculus-equations
    code: D02.06
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 分析、微积分与方程, en: Analysis, Calculus and Equations}
    definition: 研究极限、连续、变化、函数、微分积分和方程的解。
    core_questions: [连续变化怎样表示且方程何时有稳定解]
    scope_includes: [real-analysis, complex-analysis, calculus, differential-equations, functional-analysis]
    boundary_notes: 特定方程的物理或工程解释归对象领域。
    bridge_domains: [D03, D04, D05, D13]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:probability-stochastic-processes
    code: D02.07
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 概率与随机过程, en: Probability and Stochastic Processes}
    definition: 研究随机性、不确定事件、依赖结构和随时间演化的随机系统。
    core_questions: [怎样一致表示随机性和不确定事件的组合]
    scope_includes: [probability, stochastic-processes, martingales, random-fields]
    boundary_notes: 主观认识不确定性与决策解释还需 D01/D06/D10。
    bridge_domains: [D03, D05, D10, D12, D14, D17]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:statistics-inference-measurement
    code: D02.08
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 统计推断、数据与测量, en: Statistical Inference, Data and Measurement}
    definition: 研究抽样、估计、检验、贝叶斯更新、测量误差与数据生成过程。
    core_questions: [有限且有偏的数据能支持多强的总体结论]
    scope_includes: [sampling, estimation, hypothesis-testing, bayesian-inference, measurement-error]
    boundary_notes: 变量意义和数据质量由对象领域共同定义；数据工程归 D12。
    bridge_domains: [D01, D06, D07, D10, D12, D14]
    epistemic_modes: [formal, empirical, synthetic]
  - <<: *subdomain_defaults
    id: hkm:subdomain:optimization-operations-game-theory
    code: D02.09
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 优化、运筹与博弈的形式理论, en: Optimization, Operations Research and Formal Game Theory}
    definition: 研究目标、约束、资源分配、策略互动和可计算求解。
    core_questions: [在约束和多主体互动下哪些方案可行且相对更优]
    scope_includes: [optimization, operations-research, decision-theory, game-theory, mechanism-design]
    boundary_notes: 目标与偏好不是纯数学给定；社会应用连接 D09/D10/D17。
    bridge_domains: [D09, D10, D12, D13, D17]
    epistemic_modes: [formal, design]
  - <<: *subdomain_defaults
    id: hkm:subdomain:dynamical-systems-control
    code: D02.10
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 动力系统、控制与复杂性数学, en: Dynamical Systems, Control and Mathematical Complexity}
    definition: 研究状态演化、稳定性、反馈、非线性、分岔、混沌与控制。
    core_questions: [系统随时间如何变化且何种反馈能改变其行为]
    scope_includes: [dynamical-systems, control-theory, nonlinear-systems, chaos, bifurcation]
    boundary_notes: 复杂系统的领域机制和价值目标保留对象领域。
    bridge_domains: [D03, D04, D05, D10, D12, D13]
    epistemic_modes: [formal, causal, design]
  - <<: *subdomain_defaults
    id: hkm:subdomain:information-coding-cryptography
    code: D02.11
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 信息、编码与密码的形式理论, en: Formal Information, Coding and Cryptography}
    definition: 研究信息量、编码极限、压缩、传输可靠性和密码安全的数学结构。
    core_questions: [信息怎样度量编码并在噪声或对抗下可靠保护]
    scope_includes: [information-theory, coding-theory, compression, cryptography]
    boundary_notes: 语义信息不等同香农信息；系统实现归 D12/D13。
    bridge_domains: [D03, D05, D11, D12, D17]
    epistemic_modes: [formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:numerical-computational-mathematics
    code: D02.12
    parent: hkm:domain:mathematics-statistics-formal-systems
    labels: {zh: 数值与计算数学, en: Numerical and Computational Mathematics}
    definition: 研究连续和离散数学问题的近似算法、误差、稳定性和计算代价。
    core_questions: [不可解析求解的问题怎样可靠近似并控制误差]
    scope_includes: [numerical-analysis, scientific-computing, approximation, numerical-linear-algebra]
    boundary_notes: 通用软件系统归 D12；领域仿真的模型假设归对象领域。
    bridge_domains: [D03, D04, D12, D13]
    epistemic_modes: [formal, design]

  # D03 物质、能量与宇宙
  - <<: *subdomain_defaults
    id: hkm:subdomain:measurement-physical-science
    code: D03.01
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 物理量、测量与实验基础, en: Physical Quantities, Measurement and Experimental Foundations}
    definition: 研究单位、标准、仪器、误差和物理实验的可复核基础。
    core_questions: [怎样把物理概念转化为可比较且可追溯的测量]
    scope_includes: [metrology, units, instrumentation, uncertainty, experimental-design]
    boundary_notes: 通用统计误差归 D02；具体仪器工程连接 D13。
    bridge_domains: [D01, D02, D13]
    epistemic_modes: [empirical, formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:classical-mechanics-fields-waves
    code: D03.02
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 经典力学、场与波, en: Classical Mechanics, Fields and Waves}
    definition: 研究宏观运动、力、连续介质、振动、波和经典场。
    core_questions: [宏观物体和连续介质怎样在相互作用下运动]
    scope_includes: [mechanics, fluid-dynamics, elasticity, waves, classical-fields]
    boundary_notes: 工程结构与流体设计归 D13。
    bridge_domains: [D04, D13]
    epistemic_modes: [empirical, formal, causal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:electromagnetism-optics
    code: D03.03
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 电磁学与光学, en: Electromagnetism and Optics}
    definition: 研究电荷、电磁场、辐射、光及其与物质相互作用。
    core_questions: [电磁相互作用怎样传播并改变物质和信息载体]
    scope_includes: [electromagnetism, optics, photonics-foundations, radiation]
    boundary_notes: 通信、电子和光子器件设计归 D12/D13。
    bridge_domains: [D12, D13]
    epistemic_modes: [empirical, formal, causal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:thermodynamics-statistical-physics
    code: D03.04
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 热力学与统计物理, en: Thermodynamics and Statistical Physics}
    definition: 研究能量、热、功、熵、平衡、涨落和微观—宏观联系。
    core_questions: [大量微观自由度怎样产生宏观规律和不可逆性]
    scope_includes: [thermodynamics, statistical-mechanics, entropy, phase-transitions, nonequilibrium]
    boundary_notes: 信息熵与语义、生命或社会秩序的类比必须逐一说明。
    bridge_domains: [D02, D05, D12, D13]
    epistemic_modes: [empirical, formal, causal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:quantum-atomic-molecular-physics
    code: D03.05
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 量子、原子与分子物理, en: Quantum, Atomic and Molecular Physics}
    definition: 研究微观量子状态、测量、原子分子结构及光物质相互作用。
    core_questions: [微观物质和辐射为何呈现量子行为]
    scope_includes: [quantum-mechanics, atomic-physics, molecular-physics, quantum-measurement]
    boundary_notes: 量子技术实现归 D13；化学反应结构连接化学 H3。
    bridge_domains: [D02, D12, D13]
    epistemic_modes: [empirical, formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:particle-nuclear-physics
    code: D03.06
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 粒子与核物理, en: Particle and Nuclear Physics}
    definition: 研究基本粒子、基本相互作用、原子核结构与核反应。
    core_questions: [物质的最基本组成和相互作用是什么]
    scope_includes: [particle-physics, quantum-field-theory, nuclear-structure, nuclear-reactions]
    boundary_notes: 核能源和辐射防护的工程与治理连接 D13/D17。
    bridge_domains: [D04, D13, D17]
    epistemic_modes: [empirical, formal]
  - <<: *subdomain_defaults
    id: hkm:subdomain:relativity-gravitation-cosmology
    code: D03.07
    parent: hkm:domain:matter-energy-universe
    labels: {zh: 相对论、引力与宇宙学, en: Relativity, Gravitation and Cosmology}
    definition: 研究时空、引力、宇宙大尺度结构、起源与演化。
    core_questions: [时空和宇宙整体如何演化]
    scope_includes: [relativity, gravitation, cosmology, early-universe, large-scale-structure]
    boundary_notes: 天体观测和具体对象连接天文学 H3。
    bridge_domains: [D02, D04]
    epistemic_modes: [empirical, formal, historical]
  - <<: *subdomain_defaults
    id: hkm:subdomain:condensed-matter-material-properties
    code: D03.08
