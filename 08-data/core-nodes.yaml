    primary_type: framework
    labels: {zh: 法理、法律体系与法律推理, en: Jurisprudence, Legal Systems and Legal Reasoning}
    definition: 区分法律来源、效力、规则原则、事实认定、解释、先例与裁量，分析法律规范如何形成并适用于具体案件。
    core_questions: [规范从何获得法律效力且与道德正当性如何区分, 文本先例事实与目的冲突时如何给出可复核理由]
    primary_domain: hkm:domain:politics-governance-law
    related_subdomains: [hkm:subdomain:jurisprudence-legal-reasoning]
    roles: [foundation, method, boundary]
    aims: [evaluate-norm, decide-negotiate, diagnose-abduce]
    epistemic_modes: [normative, interpretive, historical, formal]
    learning_priority: S
    prerequisites: [hkm:framework:political-authority-ideology-collective-choice]
    connections: [{type: enables, target: hkm:framework:constitutional-administrative-public-law, scope: 公法推理依赖法律效力解释权力边界和救济等一般法理}]
    boundary_notes: 法律信息因司法辖区和时间变化；本骨架不构成具体法律意见，事实与程序需由有资格者核验。

  - <<: *core_defaults
