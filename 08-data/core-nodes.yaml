    epistemic_modes: [empirical, causal, formal]
    learning_priority: S
    prerequisites: [hkm:framework:atmosphere-weather-climate-system, hkm:framework:ocean-coastal-circulation-change]
    connections: [{type: enables, target: hkm:framework:soil-critical-zone-processes, scope: 水分流动控制风化土壤形成溶质迁移与植被可用水}]
    boundary_notes: 流域模型依赖边界、地下连通和参数尺度；平均水量可能掩盖季节、质量、生态和公平约束。

  - <<: *core_defaults
    id: hkm:framework:soil-critical-zone-processes
    code: K04.07
    primary_type: framework
    labels: {zh: 土壤与地球关键带过程, en: Soil and Earth Critical Zone Processes}
    definition: 研究岩石至植被冠层之间的风化、土壤形成、孔隙水、碳养分循环和生物活动如何调节地表功能。
    core_questions: [成土母质气候生物地形和时间如何共同作用, 土壤结构与微生物怎样影响水碳养分和污染物]
    primary_domain: hkm:domain:earth-space-environment
    related_subdomains: [hkm:subdomain:soil-critical-zone]
    roles: [mechanism, synthesis, evidence]
    aims: [explain-understand, describe-measure, control-maintain]
    epistemic_modes: [empirical, causal, historical]
    learning_priority: A
    prerequisites: [hkm:framework:earth-materials-interior-geophysics, hkm:framework:water-cycle-cryosphere-catchments]
    connections: [{type: influences, target: hkm:framework:pollutant-fate-risk-remediation, scope: 土壤矿物有机质孔隙和生物过程控制污染物迁移转化与暴露}]
    boundary_notes: 土壤性质空间异质且变化缓慢；表层样本不能代表剖面、季节和土地管理历史。

  - <<: *core_defaults
    id: hkm:framework:pollutant-fate-risk-remediation
    code: K04.08
    primary_type: framework
    labels: {zh: 污染物归趋、环境风险与修复, en: Pollutant Fate, Environmental Risk and Remediation}
    definition: 连接污染源、排放、输运、转化、生物累积、暴露、毒性和修复技术，形成从监测到风险管理的证据链。
    core_questions: [污染物从哪里来并通过哪些路径到达受体, 修复方案能否降低总风险且不转移污染]
    primary_domain: hkm:domain:earth-space-environment
    related_subdomains: [hkm:subdomain:environmental-science-pollution]
    roles: [mechanism, decision, design]
    aims: [diagnose-abduce, evaluate-norm, control-maintain]
    epistemic_modes: [empirical, causal, design]
    learning_priority: S
    prerequisites: [hkm:framework:water-cycle-cryosphere-catchments, hkm:framework:soil-critical-zone-processes]
    connections: [{type: uses, target: hkm:framework:geospatial-observation-mapping-inference, scope: 空间监测遥感和地图用于识别污染分布暴露热点与修复成效}]
    boundary_notes: 检出不等于不可接受风险，未检出也受检测限影响；风险阈值、混合暴露和环境正义需显式说明。

  - <<: *core_defaults
    id: hkm:framework:geospatial-observation-mapping-inference
    code: K04.09
    primary_type: framework
    additional_types: [measurement]
    labels: {zh: 地理空间观测、制图与空间推断, en: Geospatial Observation, Mapping and Spatial Inference}
    definition: 用坐标基准、测绘、遥感、GIS、空间统计和变化检测，把地点、尺度、时间和不确定性组织为可比较证据。
    core_questions: [观测的空间时间分辨率与定位误差是什么, 地图模式来自真实过程采样设计还是尺度效应]
    primary_domain: hkm:domain:earth-space-environment
    related_subdomains: [hkm:subdomain:geospatial-earth-observation]
    roles: [method, representation, evidence]
    aims: [describe-measure, identify-classify, diagnose-abduce]
    epistemic_modes: [empirical, formal, design]
    learning_priority: S
    prerequisites: [hkm:framework:earth-materials-interior-geophysics]
    connections: [{type: enables, target: hkm:framework:planetary-comparative-space-environments, scope: 遥感制图和反演方法可迁移到行星表面与空间环境研究}]
    boundary_notes: 地图是选择和投影后的模型；生态谬误、可变空间单元和敏感地点隐私必须控制。

  - <<: *core_defaults
    id: hkm:framework:planetary-comparative-space-environments
    code: K04.10
    primary_type: framework
    labels: {zh: 比较行星与空间环境, en: Comparative Planetary and Space Environments}
    definition: 比较行星内部、表面、大气、磁层、太阳风和撞击历史，用地球与遥感证据解释行星演化及任务环境。
    core_questions: [不同初始条件与反馈为何产生多样行星环境, 有限遥测和样本如何约束表面内部及宜居性]
    primary_domain: hkm:domain:earth-space-environment
    related_subdomains: [hkm:subdomain:planetary-space-environment]
    roles: [evidence, synthesis, boundary]
    aims: [explain-understand, diagnose-abduce, predict-warn]
    epistemic_modes: [empirical, comparative, historical, formal]
    learning_priority: B
    prerequisites: [hkm:framework:earth-materials-interior-geophysics, hkm:framework:geospatial-observation-mapping-inference]
    connections: [{type: refines, target: hkm:framework:life-origin-chemical-evolution-habitability, scope: 比较行星环境限定宜居性指标和生命起源可能条件}]
    boundary_notes: 地球类比既必要又可能偏误；遥感特征和生命标志需要排除非生物替代解释。

  - <<: *core_defaults
    id: hkm:framework:coupled-human-earth-sustainability
    code: K04.11
    primary_type: framework
    labels: {zh: 耦合人地系统与可持续转型, en: Coupled Human–Earth Systems and Sustainability Transitions}
    definition: 连接生态边界、资源流、基础设施、行为、制度、公平和长期反馈，评估人类活动与地球系统的共同演化和转型路径。
    core_questions: [系统边界内的环境负荷收益与风险由谁承担, 何种转型在多尺度反馈和公平约束下可持续]
    primary_domain: hkm:domain:earth-space-environment
    related_subdomains: [hkm:subdomain:human-environment-sustainability]
    roles: [synthesis, decision, boundary]
    aims: [evaluate-norm, optimize-allocate, design-create]
    epistemic_modes: [causal, normative, design, synthetic]
    learning_priority: S
    prerequisites: [hkm:framework:atmosphere-weather-climate-system, hkm:framework:water-cycle-cryosphere-catchments, hkm:framework:pollutant-fate-risk-remediation, hkm:framework:geospatial-observation-mapping-inference]
    connections: [{type: complements, target: hkm:framework:community-welfare-capabilities-social-policy, scope: 环境转型需要把生态风险与社区能力分配和社会保障共同设计}]
    boundary_notes: 可持续性指标依赖边界和价值权重；效率改进可能被反弹效应、外包和不公平转移抵消。

  # D07 社会、人类与群体骨架
  - <<: *core_defaults
    id: hkm:framework:social-theory-mixed-method-inference
    code: K07.01
    primary_type: framework
    labels: {zh: 社会理论与混合方法推断, en: Social Theory and Mixed-Method Inference}
    definition: 连接行动者、结构、制度、意义、网络和历史，综合调查、实验、统计、访谈、民族志与比较案例形成社会解释。
    core_questions: [现象需要在哪些个体关系制度和历史层次解释, 不同方法的证据如何相互检验而非简单相加]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:social-theory-methods]
    roles: [foundation, method, synthesis]
    aims: [explain-understand, diagnose-abduce, describe-measure]
    epistemic_modes: [empirical, causal, interpretive, historical]
    learning_priority: S
    prerequisites: []
    connections: [{type: enables, target: hkm:method:ethnography-cultural-comparison, scope: 社会理论帮助民族志在情境意义与更大制度结构之间往返}]
    boundary_notes: 微观意图不能单独解释宏观模式，宏观结构也不应抹去能动性；方法选择需与问题和伦理一致。

  - <<: *core_defaults
    id: hkm:method:ethnography-cultural-comparison
    code: K07.02
    primary_type: method
    labels: {zh: 民族志与文化比较, en: Ethnography and Cultural Comparison}
    definition: 通过长期参与观察、访谈、物质实践和语言语境理解生活世界，并在避免单一文明尺度下开展比较。
    core_questions: [实践对参与者意味着什么且如何嵌入关系与历史, 研究者位置翻译和进入条件怎样塑造材料]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:social-cultural-anthropology]
    roles: [method, evidence, boundary]
    aims: [explain-understand, identify-classify, evaluate-norm]
    epistemic_modes: [interpretive, comparative, historical, embodied]
    learning_priority: A
    prerequisites: [hkm:framework:social-theory-mixed-method-inference]
    connections: [{type: constrains, target: hkm:framework:culture-identity-norms-power, scope: 文化和身份概念需由具体实践语言与权力关系校正}]
    boundary_notes: 深描不自动代表整个群体；同意、匿名、互惠、知识主权和危险披露需持续协商。

  - <<: *core_defaults
    id: hkm:framework:demography-population-processes
    code: K07.03
    primary_type: framework
    labels: {zh: 人口结构与人口过程, en: Demographic Structure and Population Processes}
    definition: 用生育、死亡、迁移、年龄结构、队列和生命表研究人口规模组成变化及其与制度环境的关系。
    core_questions: [观察变化来自时期队列年龄还是迁移选择, 人口率和总量如何在结构差异下正确比较]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:demography-population]
    roles: [representation, evidence, boundary]
    aims: [describe-measure, predict-warn, optimize-allocate]
    epistemic_modes: [empirical, formal, historical]
    learning_priority: A
    prerequisites: [hkm:framework:social-theory-mixed-method-inference]
    connections: [{type: enables, target: hkm:framework:family-kinship-life-course, scope: 人口过程为家庭形成照护代际和生命历程转变提供结构背景}]
    boundary_notes: 人口预测依赖生育死亡迁移假设；平均指标会掩盖地区阶层性别和政策差异。

  - <<: *core_defaults
    id: hkm:framework:family-kinship-life-course
    code: K07.04
    primary_type: framework
    labels: {zh: 家庭、亲属与生命历程, en: Family, Kinship and the Life Course}
    definition: 研究亲属制度、家庭形成、代际交换、照护、居住安排和制度时序如何塑造个体生命轨迹与不平等。
    core_questions: [关系义务资源和照护怎样跨家庭与世代流动, 制度事件和历史时期如何改变生命历程]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:family-kinship-life-course]
    roles: [mechanism, synthesis, boundary]
    aims: [explain-understand, predict-warn, evaluate-norm]
    epistemic_modes: [empirical, historical, interpretive, comparative]
    learning_priority: B
    prerequisites: [hkm:framework:demography-population-processes, hkm:method:ethnography-cultural-comparison]
    connections: [{type: influences, target: hkm:framework:inequality-stratification-mobility, scope: 家庭资源照护与继承是社会优势劣势累积的重要通道}]
    boundary_notes: 家庭形式跨文化和历史多样；不能把特定婚姻性别或居住规范当作自然普遍结构。

  - <<: *core_defaults
    id: hkm:framework:groups-networks-collective-action
    code: K07.05
    primary_type: framework
    labels: {zh: 群体、社会网络与集体行动, en: Groups, Social Networks and Collective Action}
    definition: 用关系结构、信任、规范、扩散、身份、协调困境和动员资源解释群体形成、集体行为与社会传播。
    core_questions: [网络位置与关系强度如何改变信息机会和行为, 个体何时能够克服协调搭便车与镇压形成集体行动]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:groups-networks-collective-behavior]
    roles: [mechanism, representation, synthesis]
    aims: [explain-understand, predict-warn, decide-negotiate]
    epistemic_modes: [empirical, causal, formal]
    learning_priority: S
    prerequisites: [hkm:framework:social-theory-mixed-method-inference]
    connections: [{type: complements, target: hkm:framework:culture-identity-norms-power, scope: 网络扩散依赖群体身份规范解释和权力边界}]
    boundary_notes: 网络相关可能来自同质选择共同环境或真实影响；在线连接指标不能代表关系质量与线下权力。

  - <<: *core_defaults
    id: hkm:framework:culture-identity-norms-power
    code: K07.06
    primary_type: framework
    labels: {zh: 文化、身份、规范与权力, en: Culture, Identity, Norms and Power}
    definition: 研究意义体系、分类、惯习、仪式、身份边界和制裁如何被学习、争议、制度化并在权力关系中改变。
    core_questions: [规范如何获得正当性并通过何种制裁维持, 身份分类由谁定义且如何影响资源与自我理解]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:culture-identity-norms]
    roles: [mechanism, representation, boundary]
    aims: [explain-understand, evaluate-norm, diagnose-abduce]
    epistemic_modes: [interpretive, historical, comparative, causal]
    learning_priority: S
    prerequisites: [hkm:method:ethnography-cultural-comparison, hkm:framework:groups-networks-collective-action]
    connections: [{type: influences, target: hkm:framework:inequality-stratification-mobility, scope: 文化分类和身份边界可合法化或挑战资源与地位差异}]
    boundary_notes: 文化不是封闭同质容器；解释差异时需避免本质化、群体归责和忽视制度强制。

  - <<: *core_defaults
    id: hkm:framework:inequality-stratification-mobility
    code: K07.07
    primary_type: framework
    labels: {zh: 不平等、分层与社会流动, en: Inequality, Stratification and Social Mobility}
    definition: 连接阶级、种族化、性别、教育、财富、职业、空间和制度歧视，分析优势如何产生、交叉、积累和传递。
    core_questions: [资源机会风险和尊严沿哪些轴线不均分配, 流动指标是否区分绝对改善相对位置与代际再生产]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:inequality-stratification]
    roles: [synthesis, evidence, boundary]
    aims: [describe-measure, explain-understand, evaluate-norm]
    epistemic_modes: [empirical, causal, historical, normative]
    learning_priority: S
    prerequisites: [hkm:framework:family-kinship-life-course, hkm:framework:culture-identity-norms-power]
    connections: [{type: constrains, target: hkm:framework:community-welfare-capabilities-social-policy, scope: 福利设计需识别结构性障碍差异需求和实际能力而非只比较名义资源}]
    boundary_notes: 群体平均差异不说明个体本质；收入单指标不能覆盖财富权力健康时间和安全等多维不平等。

  - <<: *core_defaults
    id: hkm:framework:organizations-institutions-fields
    code: K07.08
    primary_type: framework
    labels: {zh: 组织、制度与社会场域, en: Organizations, Institutions and Social Fields}
    definition: 研究正式规则、非正式惯例、组织边界、专业规范、资源依赖和合法性如何协调行动并产生惯性和变化。
    core_questions: [组织如何在环境约束下获得资源权威与协调能力, 制度为何持续扩散失灵或被行动者改变]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:organizations-institutions-sociology]
    roles: [mechanism, synthesis, boundary]
    aims: [explain-understand, predict-warn, design-create]
    epistemic_modes: [empirical, causal, historical, interpretive]
    learning_priority: A
    prerequisites: [hkm:framework:social-theory-mixed-method-inference, hkm:framework:groups-networks-collective-action]
    connections: [{type: complements, target: hkm:framework:governance-regulation-institutional-design, scope: 社会学解释制度实际运行，治理设计规定权责激励与救济}]
    boundary_notes: 正式组织图不代表真实工作网络；制度同形可能掩盖执行能力与地方适配差异。

  - <<: *core_defaults
    id: hkm:framework:place-urban-rural-spatial-relations
    code: K07.09
    primary_type: framework
    labels: {zh: 地方、城乡与空间社会关系, en: Place, Urban–Rural and Spatial Social Relations}
    definition: 连接地点意义、土地使用、住房、基础设施、交通、城市化、乡村转型和区域不平衡，解释空间如何组织社会机会。
    core_questions: [空间布局和基础设施如何分配可达性风险与机会, 地方尺度如何连接区域国家与全球过程]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:human-geography-urban-rural]
    roles: [representation, synthesis, decision]
    aims: [describe-measure, explain-understand, optimize-allocate]
    epistemic_modes: [empirical, historical, interpretive, design]
    learning_priority: A
    prerequisites: [hkm:framework:social-theory-mixed-method-inference]
    connections: [{type: enables, target: hkm:framework:migration-globalization-transnationalism, scope: 地方机会住房边界和基础设施共同塑造迁移路径与定居结果}]
    boundary_notes: 城市与乡村不是固定二分；地图边界和行政尺度会改变对隔离贫困与服务可达性的判断。

  - <<: *core_defaults
    id: hkm:framework:migration-globalization-transnationalism
    code: K07.10
    primary_type: framework
    labels: {zh: 迁移、全球化与跨国联系, en: Migration, Globalization and Transnationalism}
    definition: 研究人口、资本、商品、观念和制度跨边界流动，以及国家、网络、家庭和身份如何共同塑造移动与停留。
    core_questions: [迁移由哪些推拉网络政策和生命周期因素产生, 跨国联系如何改变原居地目的地与身份归属]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:migration-globalization]
    roles: [mechanism, synthesis, boundary]
    aims: [explain-understand, predict-warn, evaluate-norm]
    epistemic_modes: [empirical, historical, comparative, causal]
    learning_priority: B
    prerequisites: [hkm:framework:demography-population-processes, hkm:framework:place-urban-rural-spatial-relations]
    connections: [{type: influences, target: hkm:framework:family-kinship-life-course, scope: 迁移重组家庭照护汇款身份与代际轨迹}]
    boundary_notes: 迁移者不是同质群体；自愿强迫合法身份技能和性别差异会产生不同风险与机会。

  - <<: *core_defaults
    id: hkm:framework:community-welfare-capabilities-social-policy
    code: K07.11
    primary_type: framework
    labels: {zh: 社区、福利、能力与社会政策, en: Community, Welfare, Capabilities and Social Policy}
    definition: 连接社会支持、公共服务、保障制度、社区组织与能力方法，评价人们是否拥有实际可行的安全参与和发展机会。
    core_questions: [人们面临哪些相互叠加的脆弱性与照护需求, 服务资源权利和关系支持能否转化为真实能力]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:community-welfare-social-policy]
    roles: [decision, synthesis, boundary]
    aims: [evaluate-norm, optimize-allocate, control-maintain]
    epistemic_modes: [empirical, normative, design, interpretive]
    learning_priority: S
    prerequisites: [hkm:framework:inequality-stratification-mobility, hkm:framework:organizations-institutions-fields]
    connections: [{type: complements, target: hkm:framework:policy-cycle-public-administration-implementation, scope: 社区经验和能力评价为政策设计执行与反馈提供对象证据}]
    boundary_notes: 名义福利覆盖不等于可达和有尊严的支持；指标需防止污名化监控和把结构问题个体化。

  - <<: *core_defaults
    id: hkm:framework:science-technology-society-coproduction
    code: K07.12
    primary_type: framework
    labels: {zh: 科学技术社会共构, en: Science, Technology and Society Co-Production}
    definition: 研究知识、技术物、标准、基础设施、专业权威和公众如何共同生产事实、能力、风险与社会秩序。
    core_questions: [技术设计内嵌了哪些价值用户与制度假设, 专业知识和公众经验如何在争议中获得或失去权威]
    primary_domain: hkm:domain:society-human-groups
    related_subdomains: [hkm:subdomain:science-technology-society]
    roles: [synthesis, boundary, evidence]
    aims: [explain-understand, evaluate-norm, design-create]
    epistemic_modes: [historical, interpretive, empirical, normative]
    learning_priority: A
    prerequisites: [hkm:framework:organizations-institutions-fields, hkm:framework:culture-identity-norms-power]
    connections: [{type: complements, target: hkm:norm-value:engineering-ethics-safety-responsibility, scope: 技术治理需要把性能安全与制度权力劳动和社会分类共同分析}]
    boundary_notes: 社会建构不意味着物质约束和经验事实不存在；参与机制需避免象征性咨询和代表性偏差。

  # D08 历史、考古与文明骨架
  - <<: *core_defaults
    id: hkm:method:historical-reasoning-source-criticism
    code: K08.01
    primary_type: method
    labels: {zh: 历史推理、史料批判与叙事, en: Historical Reasoning, Source Criticism and Narrative}
    definition: 评估史料出处、语境、目的、沉默、互证和时间关系，构造能区分证据、推断、争议与反事实的历史解释。
    core_questions: [材料由谁在何种情境为谁产生并保存, 哪种因果叙事最能解释时序机制与替代可能]
    primary_domain: hkm:domain:history-archaeology-civilization
    related_subdomains: [hkm:subdomain:historiography-sources-methods]
    roles: [foundation, method, evidence]
    aims: [diagnose-abduce, explain-understand, evaluate-norm]
    epistemic_modes: [historical, interpretive, comparative]
    learning_priority: S
    prerequisites: []
    connections: [{type: enables, target: hkm:method:archaeological-context-material-culture, scope: 物质遗存同样需要来源语境形成过程与保存偏差批判}]
    boundary_notes: 史料缺失不是事件未发生的证明；历史叙事不可避免选择视角但仍受证据和反证约束。

  - <<: *core_defaults
    id: hkm:method:archaeological-context-material-culture
    code: K08.02
    primary_type: method
    labels: {zh: 考古语境、地层与物质文化, en: Archaeological Context, Stratigraphy and Material Culture}
    definition: 通过地层、年代、遗物组合、空间分布、生物考古和实验分析重建过去行为、环境与社会组织。
    core_questions: [遗存如何形成扰动和保存且其关联是否同一时期, 物质模式能支持哪些行为社会与交换解释]
    primary_domain: hkm:domain:history-archaeology-civilization
    related_subdomains: [hkm:subdomain:archaeology-material-past]
    roles: [method, evidence, boundary]
    aims: [diagnose-abduce, describe-measure, explain-understand]
    epistemic_modes: [historical, empirical, causal]
    learning_priority: S
    prerequisites: [hkm:method:historical-reasoning-source-criticism]
    connections: [{type: enables, target: hkm:framework:prehistory-ancient-state-society, scope: 考古证据是无文字与早期国家社会重建的主要基础}]
    boundary_notes: 物质类型不等同族群或身份；发掘具有不可逆性并受遗产归属、祖先遗骸和社区同意约束。

  - <<: *core_defaults
