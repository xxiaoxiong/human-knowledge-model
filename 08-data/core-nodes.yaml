    prerequisites: [hkm:framework:systems-architecture-interfaces]
    connections: [{type: enables, target: hkm:practice:operations-maintenance-repair, scope: 可替换模块、文档和通用接口提高诊断维修与备件可得性}]
    boundary_notes: 标准可形成锁定和权力；互操作测试合格不保证语义、组织流程或安全目标完全一致。

  - <<: *core_defaults
    id: hkm:practice:engineering-project-configuration-change
