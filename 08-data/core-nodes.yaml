schema_version: 0.1.0
model_version: 0.3.0-draft
description: 领域核心骨架内容节点；首批以 D03、D10、D13、D20 为四类模板域。
published_domains: [D03, D10, D13, D20]

defaults: &core_defaults
  status: active
  version: 0.3.0-draft

core_nodes:
  # D03 自然规律模板
  - <<: *core_defaults
    id: hkm:framework:physical-quantities-dimensional-analysis
    code: K03.01
    primary_type: framework
    additional_types: [measurement]
    labels: {zh: 物理量、单位与量纲分析, en: Physical Quantities, Units and Dimensional Analysis}
    definition: 用可操作量、单位制和量纲关系把观察、方程与尺度比较连接起来的基础表征框架。
    core_questions: [什么被测量且单位如何定义, 方程与估算是否在量纲上自洽]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:measurement-physical-science]
    roles: [foundation, representation, method]
    aims: [describe-measure, learn-transfer]
    epistemic_modes: [empirical, formal]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:law-principle:conservation-laws-balances, scope: 量纲一致是守恒方程可解释的必要但非充分条件}]
    boundary_notes: 量纲正确不证明模型或因果机制正确；无量纲常数也可能承载关键经验信息。

  - <<: *core_defaults
    id: hkm:law-principle:conservation-laws-balances
    code: K03.02
    primary_type: law-principle
    labels: {zh: 守恒律与收支平衡, en: Conservation Laws and Balances}
    definition: 用系统边界内的存量、通量、源与汇表述质量、能量、动量、电荷等量如何变化。
    core_questions: [什么在给定边界和相互作用下守恒, 观察到的变化来自通量还是源汇]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:classical-mechanics-fields-waves, hkm:subdomain:thermodynamics-statistical-physics, hkm:subdomain:particle-nuclear-physics]
    roles: [foundation, mechanism]
    aims: [explain-understand, predict-warn]
    epistemic_modes: [formal, causal, empirical]
    learning_priority: S
    prerequisites: [hkm:framework:physical-quantities-dimensional-analysis]
    connections: [{type: constrains, target: hkm:framework:energy-entropy-free-energy, scope: 能量守恒约束过程但不单独决定过程方向}]
    boundary_notes: 必须声明系统边界、开放性和近似；局部守恒、全局守恒与有效理论中的守恒不可混为一谈。

  - <<: *core_defaults
    id: hkm:law-principle:symmetry-invariance
    code: K03.03
    primary_type: law-principle
    labels: {zh: 对称性与不变性, en: Symmetry and Invariance}
    definition: 研究表征或物理变换后哪些结构保持不变，并用不变性限制可行规律和分类。
    core_questions: [哪些变换不改变可观察规律, 对称破缺如何产生可见结构]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:classical-mechanics-fields-waves, hkm:subdomain:quantum-atomic-molecular-physics, hkm:subdomain:particle-nuclear-physics]
    roles: [foundation, mechanism, representation]
    aims: [identify-classify, explain-understand]
    epistemic_modes: [formal, causal]
    learning_priority: A
    prerequisites: [hkm:framework:physical-quantities-dimensional-analysis]
    connections: [{type: explains, target: hkm:law-principle:conservation-laws-balances, scope: 在满足相应作用量与连续对称条件时由 Noether 型关系连接}]
    boundary_notes: 对称性是模型和规律的结构，不代表对象外观必然对称；离散、连续和规范对称需区分。

  - <<: *core_defaults
    id: hkm:framework:fields-forces-interactions
    code: K03.04
    primary_type: framework
    labels: {zh: 场、力与相互作用, en: Fields, Forces and Interactions}
    definition: 用局域场、势、交换或有效作用描述对象如何相互影响和传递动量能量。
    core_questions: [相互作用通过什么自由度传播, 何时使用力场势或交换表征]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:classical-mechanics-fields-waves, hkm:subdomain:electromagnetism-optics, hkm:subdomain:particle-nuclear-physics]
    roles: [mechanism, representation]
    aims: [explain-understand, predict-warn]
    epistemic_modes: [formal, causal, empirical]
    learning_priority: S
    prerequisites: [hkm:framework:physical-quantities-dimensional-analysis]
    connections: [{type: explains, target: hkm:model:waves-spectra-signals, scope: 场方程的扰动和传播产生多类波动现象}]
    boundary_notes: 经典力、连续场、量子场和有效相互作用属于不同层次，不能无条件互换。

  - <<: *core_defaults
    id: hkm:model:waves-spectra-signals
    code: K03.05
    primary_type: model
    labels: {zh: 波、频谱与物理信号, en: Waves, Spectra and Physical Signals}
    definition: 用振幅、相位、频率、叠加、色散和谱线表征传播、振荡及从信号反推结构的过程。
    core_questions: [扰动如何传播和叠加, 频谱如何揭示源与介质]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:classical-mechanics-fields-waves, hkm:subdomain:electromagnetism-optics, hkm:subdomain:analytical-chemical-measurement, hkm:subdomain:astronomy-astrophysics]
    roles: [representation, evidence, mechanism]
    aims: [describe-measure, diagnose-abduce, predict-warn]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: S
    prerequisites: [hkm:framework:fields-forces-interactions]
    connections: [{type: enables, target: hkm:method:physical-experiment-measurement-uncertainty, scope: 频谱和信号处理使大量间接测量成为可能}]
    boundary_notes: 信号表征依赖仪器响应、噪声和采样；相同频谱不必对应唯一机制。

  - <<: *core_defaults
    id: hkm:framework:energy-entropy-free-energy
    code: K03.06
    primary_type: framework
    additional_types: [law-principle]
    labels: {zh: 能量、熵与自由能, en: Energy, Entropy and Free Energy}
    definition: 结合能量收支、状态数与可用功，判断过程可行方向、平衡条件和转换上限。
    core_questions: [过程在能量上是否可行, 不可逆性与可用功如何受熵约束]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:thermodynamics-statistical-physics, hkm:subdomain:physical-theoretical-chemistry]
    roles: [foundation, mechanism, boundary]
    aims: [explain-understand, predict-warn, optimize-allocate]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: S
    prerequisites: [hkm:law-principle:conservation-laws-balances]
    connections: [{type: constrains, target: hkm:framework:equilibrium-kinetics-timescales, scope: 热力学约束方向和平衡，动力学决定路径与速率}]
    boundary_notes: 熵在热力学、统计物理和信息论中的定义相关但不等同；自由能依赖约束和系综。

  - <<: *core_defaults
    id: hkm:framework:scale-coarse-graining-emergence
    code: K03.07
    primary_type: framework
    labels: {zh: 尺度、粗粒化与涌现, en: Scale, Coarse-Graining and Emergence}
    definition: 分析微观自由度如何在尺度变换和信息压缩后形成宏观变量、有效规律与集体性质。
    core_questions: [哪些细节在目标尺度上可忽略, 宏观规律如何从微观互动中出现]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:thermodynamics-statistical-physics, hkm:subdomain:condensed-matter-material-properties, hkm:subdomain:astronomy-astrophysics]
    roles: [foundation, synthesis, boundary]
    aims: [explain-understand, learn-transfer]
    epistemic_modes: [formal, causal, synthetic]
    learning_priority: A
    prerequisites: [hkm:framework:energy-entropy-free-energy]
    connections: [{type: explains, target: hkm:framework:structure-property-phase-relations, scope: 多尺度组织和集体行为连接微观结构与宏观性质}]
    boundary_notes: 涌现不等于机制不可研究；有效规律的适用尺度和粗粒化选择必须声明。

  - <<: *core_defaults
    id: hkm:model:quantum-states-observables-measurement
    code: K03.08
    primary_type: model
    additional_types: [framework]
    labels: {zh: 量子态、可观测量与测量, en: Quantum States, Observables and Measurement}
    definition: 用态空间、算符、概率幅和测量规则表征微观系统及其可预测结果。
    core_questions: [量子态编码什么预测信息, 测量与动力学如何连接可观测结果]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:quantum-atomic-molecular-physics, hkm:subdomain:particle-nuclear-physics]
    roles: [foundation, representation, boundary]
    aims: [explain-understand, predict-warn]
    epistemic_modes: [formal, empirical]
    learning_priority: A
    prerequisites: [hkm:framework:physical-quantities-dimensional-analysis, hkm:law-principle:symmetry-invariance]
    connections: [{type: explains, target: hkm:model:molecular-structure-bonding, scope: 量子态与相互作用构成原子、分子结构和成键模型的基础}]
    boundary_notes: 不同量子诠释对本体承诺不同但可能给出同一实验预测；模型层与哲学解释需分开。

  - <<: *core_defaults
    id: hkm:model:molecular-structure-bonding
    code: K03.09
    primary_type: model
    labels: {zh: 原子分子结构与化学键, en: Atomic and Molecular Structure and Bonding}
    definition: 用电子结构、轨道、键合、几何和分子间作用解释物质组成、稳定性与反应倾向。
    core_questions: [原子如何组成分子与固体, 电子结构如何影响几何和反应性]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:quantum-atomic-molecular-physics, hkm:subdomain:physical-theoretical-chemistry, hkm:subdomain:inorganic-materials-chemistry, hkm:subdomain:organic-biological-chemistry]
    roles: [mechanism, representation]
    aims: [identify-classify, explain-understand, predict-warn]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: S
    prerequisites: [hkm:model:quantum-states-observables-measurement]
    connections: [{type: explains, target: hkm:framework:structure-property-phase-relations, scope: 成分、键合和几何是性质差异的关键微观来源}]
    boundary_notes: 轨道、键级和价键图是目的相关模型，不应被当作可直接观察的唯一实体划分。

  - <<: *core_defaults
    id: hkm:framework:equilibrium-kinetics-timescales
    code: K03.10
    primary_type: framework
    labels: {zh: 平衡、动力学与时间尺度, en: Equilibrium, Kinetics and Timescales}
    definition: 区分状态是否热力学有利、过程以何种路径和速率发生，以及观测窗口是否足够长。
    core_questions: [系统趋向何种状态, 路径势垒与时间尺度为何使可行过程不发生或滞后]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:thermodynamics-statistical-physics, hkm:subdomain:physical-theoretical-chemistry, hkm:subdomain:organic-biological-chemistry]
    roles: [mechanism, representation, boundary]
    aims: [explain-understand, predict-warn, control-maintain]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: S
    prerequisites: [hkm:framework:energy-entropy-free-energy, hkm:model:molecular-structure-bonding]
    connections: [{type: explains, target: hkm:framework:chemical-transformations-reaction-networks, scope: 平衡常数、速率律和势垒共同约束反应网络行为}]
    boundary_notes: 达到稳态不等于达到平衡；快慢依赖温度、浓度、催化和观察尺度。

  - <<: *core_defaults
    id: hkm:framework:structure-property-phase-relations
    code: K03.11
    primary_type: framework
    labels: {zh: 结构—性质—相态关系, en: Structure–Property–Phase Relations}
    definition: 连接成分、微观结构、缺陷、相变与材料的力学、电学、光学、热学和化学性质。
    core_questions: [哪些结构层级控制目标性质, 条件变化为何引发相变或性能突变]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:condensed-matter-material-properties, hkm:subdomain:inorganic-materials-chemistry, hkm:subdomain:organic-biological-chemistry]
    roles: [mechanism, synthesis, representation]
    aims: [explain-understand, predict-warn, design-create]
    epistemic_modes: [empirical, causal, formal]
    learning_priority: A
    prerequisites: [hkm:framework:scale-coarse-graining-emergence, hkm:model:molecular-structure-bonding]
    connections: [{type: complements, target: hkm:framework:equilibrium-kinetics-timescales, scope: 性质和相态需同时由结构状态与转变路径解释}]
    boundary_notes: 结构—性质相关不自动给出制造路径；服役性能还受加工、缺陷和环境历史影响。

  - <<: *core_defaults
    id: hkm:framework:chemical-transformations-reaction-networks
    code: K03.12
    primary_type: framework
    labels: {zh: 化学转化与反应网络, en: Chemical Transformations and Reaction Networks}
    definition: 用化学计量、反应机制、能量面、催化与耦合网络表征物质组成如何改变。
    core_questions: [反应通过哪些中间步骤发生, 网络结构如何决定选择性产率与稳态]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:physical-theoretical-chemistry, hkm:subdomain:organic-biological-chemistry, hkm:subdomain:analytical-chemical-measurement]
    roles: [mechanism, representation]
    aims: [explain-understand, predict-warn, control-maintain]
    epistemic_modes: [empirical, causal, formal]
    learning_priority: A
    prerequisites: [hkm:model:molecular-structure-bonding, hkm:framework:equilibrium-kinetics-timescales]
    connections: [{type: depends-on, target: hkm:law-principle:conservation-laws-balances, scope: 化学计量和元素收支受质量与电荷守恒约束}]
    boundary_notes: 总反应式不等于机制；体外或理想条件的反应网络不能无条件外推到工业或生命系统。

  - <<: *core_defaults
    id: hkm:model:spacetime-gravity-relativity
    code: K03.13
    primary_type: model
    additional_types: [theory]
    labels: {zh: 时空、引力与相对性, en: Spacetime, Gravitation and Relativity}
    definition: 用时空结构、参考系和物质能量对几何的影响描述高速、强引力和宇宙尺度现象。
    core_questions: [时空测量如何依赖运动与引力, 物质能量如何塑造引力动力学]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:relativity-gravitation-cosmology, hkm:subdomain:astronomy-astrophysics]
    roles: [foundation, representation, mechanism]
    aims: [explain-understand, predict-warn]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: B
    prerequisites: [hkm:framework:physical-quantities-dimensional-analysis, hkm:law-principle:symmetry-invariance]
    connections: [{type: explains, target: hkm:framework:cosmic-evolution-observational-inference, scope: 引力和时空动力学约束恒星、星系及宇宙演化模型}]
    boundary_notes: 牛顿近似在广泛低速弱场条件下仍有效；相对论表述不意味着一切判断都相对。

  - <<: *core_defaults
    id: hkm:framework:cosmic-evolution-observational-inference
    code: K03.14
    primary_type: framework
    labels: {zh: 宇宙演化与观测推断, en: Cosmic Evolution and Observational Inference}
    definition: 结合辐射、引力、核反应、距离尺度和历史光锥，从远程信号重建天体与宇宙的形成演化。
    core_questions: [如何从有限远程观测推断天体性质与历史, 多尺度过程如何形成宇宙结构]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:relativity-gravitation-cosmology, hkm:subdomain:particle-nuclear-physics, hkm:subdomain:astronomy-astrophysics]
    roles: [synthesis, evidence, representation]
    aims: [describe-measure, explain-understand, diagnose-abduce]
    epistemic_modes: [empirical, formal, historical, synthetic]
    learning_priority: B
    prerequisites: [hkm:model:waves-spectra-signals, hkm:model:spacetime-gravity-relativity]
    connections: [{type: depends-on, target: hkm:method:physical-experiment-measurement-uncertainty, scope: 距离、光度、谱线和选择效应决定宇宙推断可信度}]
    boundary_notes: 天文观测通常不可操纵对象；模型选择、选择偏差和不可见成分使推断具有欠定性。

  - <<: *core_defaults
    id: hkm:method:physical-experiment-measurement-uncertainty
    code: K03.15
    primary_type: method
    additional_types: [measurement]
    labels: {zh: 物理实验、测量链与不确定性, en: Physical Experiment, Measurement Chains and Uncertainty}
    definition: 从操作定义、校准、仪器响应、采样和误差传播构建可复现的观察与模型检验链。
    core_questions: [观测值如何由对象经仪器和处理产生, 不确定性与系统误差怎样限制结论]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:measurement-physical-science, hkm:subdomain:analytical-chemical-measurement, hkm:subdomain:astronomy-astrophysics]
    roles: [evidence, method, boundary]
    aims: [describe-measure, evaluate-norm, diagnose-abduce]
    epistemic_modes: [empirical, formal]
    learning_priority: S
    prerequisites: [hkm:framework:physical-quantities-dimensional-analysis, hkm:model:waves-spectra-signals]
    connections: [{type: operationalizes, target: hkm:framework:physical-quantities-dimensional-analysis, scope: 测量程序把物理量定义落实为仪器、校准与数据处理操作}]
    boundary_notes: 精密不等于准确，统计误差不包含全部系统误差；复现失败也可能来自未建模情境差异。

  # D10 社会制度模板
  - <<: *core_defaults
    id: hkm:concept:scarcity-opportunity-cost-tradeoffs
    code: K10.01
    primary_type: concept
    labels: {zh: 稀缺、机会成本与权衡, en: Scarcity, Opportunity Cost and Trade-offs}
    definition: 以有限资源和互斥选择为起点，比较采取某方案所放弃的最佳替代及其分配后果。
    core_questions: [真正稀缺的资源是什么, 选择该方案放弃了什么且由谁承担]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:public-labor-development-environment-economics, hkm:subdomain:operations-supply-chains-quality]
    roles: [foundation, decision, boundary]
    aims: [optimize-allocate, decide-negotiate, evaluate-norm]
    epistemic_modes: [formal, empirical, normative]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:framework:marginal-choice-equilibrium-welfare, scope: 机会成本定义边际比较和可行选择集}]
    boundary_notes: 稀缺不决定分配应当如何；货币价格可能遗漏权力、公共价值、不可逆损害和无偿劳动。

  - <<: *core_defaults
    id: hkm:framework:marginal-choice-equilibrium-welfare
    code: K10.02
    primary_type: framework
    labels: {zh: 边际选择、均衡与福利, en: Marginal Choice, Equilibrium and Welfare}
    definition: 用偏好、边际收益成本、约束和相互一致的选择分析个体行为、市场结果与福利变化。
    core_questions: [在约束下多做一单位的净效果是什么, 个体最优如何形成或不能形成社会可取结果]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:behavioral-experimental-economics]
    roles: [foundation, representation, decision]
    aims: [explain-understand, predict-warn, optimize-allocate]
    epistemic_modes: [formal, empirical, normative]
    learning_priority: S
    prerequisites: [hkm:concept:scarcity-opportunity-cost-tradeoffs]
    connections: [{type: depends-on, target: hkm:framework:information-asymmetry-signals, scope: 均衡预测随信息集合和信念结构改变}]
    boundary_notes: 均衡是相容性条件而非道德认可或动态稳定保证；偏好也可能受制度和社会塑造。

  - <<: *core_defaults
    id: hkm:framework:incentives-strategy-mechanism-design
    code: K10.03
    primary_type: framework
    labels: {zh: 激励、策略互动与机制设计, en: Incentives, Strategic Interaction and Mechanism Design}
    definition: 研究多主体在规则、预期和他人选择下的策略行为，以及如何设计规则使私人行动接近集体目标。
    core_questions: [规则如何改变行为而非只改变口号, 个体最优与集体结果为何偏离]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:industrial-information-digital-economics, hkm:subdomain:organization-design-governance]
    roles: [mechanism, design, decision]
    aims: [explain-understand, design-create, decide-negotiate]
    epistemic_modes: [formal, empirical, causal, design]
    learning_priority: S
