    epistemic_modes: [normative, interpretive, historical, comparative]
    learning_priority: S
    prerequisites: [hkm:framework:jurisprudence-legal-reasoning-systems]
    connections: [{type: constrains, target: hkm:framework:policy-cycle-public-administration-implementation, scope: 政策设计执行必须遵守权限程序平等比例和救济要求}]
    boundary_notes: 成文宪法与实际宪制可能不同；紧急状态和国家安全主张仍需合法性必要性与监督审查。

