  # D04 地球、空间与环境骨架
  - <<: *core_defaults
    id: hkm:framework:earth-materials-interior-geophysics
    code: K04.01
    primary_type: framework
    labels: {zh: 地球物质、内部结构与地球物理, en: Earth Materials, Interior Structure and Geophysics}
    definition: 结合矿物岩石、地球化学、弹性波、重力、热流与磁场，推断地球内部组成、结构、状态和演化。
    core_questions: [地表与物理信号如何约束不可直接观测的地球内部, 物质性质和能量传输怎样驱动内部过程]
    primary_domain: hkm:domain:earth-space-environment
    related_subdomains: [hkm:subdomain:geology-earth-materials-geophysics]
