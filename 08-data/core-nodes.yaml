    connections: [{type: complements, target: hkm:framework:governance-regulation-institutional-design, scope: 私法自治需要消费者竞争劳动与环境监管设定外部边界}]
    boundary_notes: 合同文本不能脱离强制法、事实履行与不平等议价；跨境交易需确认适用法和管辖。

