    definition: 研究国家机构权力配置、基本权利、依法行政、程序正当、司法审查和公共责任的规则与实践。
    core_questions: [公权由谁以何种程序授权限制和监督, 权利受到限制时适用什么标准与救济]
    primary_domain: hkm:domain:politics-governance-law
    related_subdomains: [hkm:subdomain:constitutional-administrative-public-law]
