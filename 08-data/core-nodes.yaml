    connections: [{type: produces, target: hkm:practice:engineering-project-configuration-change, scope: 根因与修复证据应进入配置、变更和经验反馈记录}]
    boundary_notes: “五个为什么”等工具不能代替机制证据；在高能量、有毒或关键系统上必须先隔离风险并遵守资质边界。

  # D20 生活实践模板
  - <<: *core_defaults
    id: hkm:framework:everyday-risk-triage-escalation
    code: K20.01
    primary_type: framework
    labels: {zh: 日常风险分级、行动阈值与专业求助, en: Everyday Risk Triage, Action Thresholds and Escalation}
    definition: 依据严重性、紧迫性、不确定性、可逆性和个人能力，决定自行处理、观察、停止、求助或紧急升级。
    core_questions: [最坏可信后果和时间窗口是什么, 哪些红旗意味着应停止并求助专业人员]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:personal-health-self-care-navigation, hkm:subdomain:home-household-maintenance-repair, hkm:subdomain:emergency-preparedness-first-response]
    roles: [foundation, decision, boundary]
    aims: [predict-warn, diagnose-abduce, decide-negotiate]
    epistemic_modes: [empirical, causal, embodied, synthetic]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:skill:personal-health-self-care-navigation, scope: 健康自护必须先识别紧急红旗、资质边界和求助阈值}]
    boundary_notes: 分级框架不能诊断专业问题；当信息不足且后果严重不可逆时，应偏向安全升级而非自信猜测。

  - <<: *core_defaults
    id: hkm:skill:personal-health-self-care-navigation
    code: K20.02
    primary_type: skill
    labels: {zh: 个人健康、自护与就医导航, en: Personal Health, Self-Care and Care Navigation}
    definition: 通过症状记录、基础预防、用药核对、就医准备和连续照护，在安全边界内管理常见健康需要。
    core_questions: [哪些情况适合自护观察或预约就医, 如何向专业人员准确提供症状时间线与用药信息]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:personal-health-self-care-navigation]
    roles: [practice, decision, boundary]
    aims: [describe-measure, control-maintain, decide-negotiate]
    epistemic_modes: [empirical, embodied, synthetic]
    learning_priority: S
    prerequisites: [hkm:framework:everyday-risk-triage-escalation]
    connections: [{type: complements, target: hkm:skill:emergency-preparedness-first-response, scope: 日常健康管理与紧急识别、急救和转运准备互补}]
    boundary_notes: 不自行替代诊断处方或侵入性治疗；药物相互作用、孕产、儿童、老人和慢病需更低求助阈值。

  - <<: *core_defaults
    id: hkm:practice:food-hygiene-cooking-household-nutrition
    code: K20.03
    primary_type: practice
    labels: {zh: 食品卫生、烹饪与家庭营养, en: Food Hygiene, Cooking and Household Nutrition}
    definition: 通过采购、储存、交叉污染控制、加热、份量和膳食组合，把食物安全与可持续日常饮食结合。
    core_questions: [如何降低食源风险并保留营养与可口性, 如何在预算文化健康和时间约束下安排饮食]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:cooking-food-household-nutrition]
    roles: [practice, design, boundary]
    aims: [control-maintain, design-create, optimize-allocate]
    epistemic_modes: [empirical, design, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:everyday-risk-triage-escalation]
    connections: [{type: complements, target: hkm:practice:household-care-coordination, scope: 饮食安排常与过敏、照护需要、家庭分工和预算共同决定}]
    boundary_notes: 通用膳食建议不能替代过敏、吞咽障碍、代谢病或进食障碍的专业方案；外观气味不能排除全部污染。

  - <<: *core_defaults
    id: hkm:skill:household-systems-maintenance-repair
    code: K20.04
    primary_type: skill
    additional_types: [practice]
    labels: {zh: 家庭系统检查、维护与安全维修, en: Household Systems Inspection, Maintenance and Safe Repair}
    definition: 识别住所结构、水、电、燃气、通风、设备和耗材的状态，执行低风险维护并在越界前停手求助。
    core_questions: [故障属于哪一系统且能否安全隔离, 哪些检查维护可自行做而哪些需要持证专业人员]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:home-household-maintenance-repair]
    roles: [practice, method, boundary]
    aims: [diagnose-abduce, control-maintain, predict-warn]
    epistemic_modes: [empirical, causal, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:everyday-risk-triage-escalation]
    connections: [{type: complements, target: hkm:skill:craft-making-low-risk-repair, scope: 基础制作技能支持低风险修复，但家庭公用系统需要更严格隔离与资质判断}]
    boundary_notes: 不在带电、燃气泄漏、承重结构、制冷剂或未知有害材料上尝试无资质维修；先断能、确认和验证。

  - <<: *core_defaults
    id: hkm:practice:personal-finance-budgeting-risk
    code: K20.05
    primary_type: practice
    labels: {zh: 个人财务、预算、负债与风险保护, en: Personal Finance, Budgeting, Debt and Risk Protection}
    definition: 管理现金流、应急储备、负债成本、保险、长期目标和账户安全，使决策匹配期限与风险承受能力。
    core_questions: [现金流和关键风险暴露在哪里, 决策在费用税收流动性和最坏情形后是否仍可承受]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:personal-finance-consumer-capability]
    roles: [practice, decision, boundary]
    aims: [describe-measure, optimize-allocate, predict-warn]
    epistemic_modes: [empirical, formal, design]
    learning_priority: S
    prerequisites: [hkm:framework:everyday-risk-triage-escalation]
    connections: [{type: complements, target: hkm:skill:consumer-legal-public-service-navigation, scope: 金融产品决策需要合同、申诉、监管与公共保障导航能力}]
    boundary_notes: 不把一般教育当个性化投资建议；高收益承诺、杠杆、集中持仓、流动性错配和诈骗需优先识别。

  - <<: *core_defaults
    id: hkm:skill:consumer-legal-public-service-navigation
    code: K20.06
    primary_type: skill
    labels: {zh: 消费者、合同、法律与公共服务导航, en: Consumer, Contract, Legal and Public-Service Navigation}
    definition: 阅读关键条款、保存证据、识别权利义务、按期限使用投诉申诉和公共服务渠道。
    core_questions: [我同意了什么且关键期限证据和救济是什么, 哪个机构或专业人士有权处理]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:civic-legal-economic-navigation, hkm:subdomain:personal-finance-consumer-capability]
    roles: [practice, decision, boundary]
    aims: [identify-classify, decide-negotiate, control-maintain]
    epistemic_modes: [interpretive, empirical, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:everyday-risk-triage-escalation]
    connections: [{type: depends-on, target: hkm:skill:digital-security-media-information-literacy, scope: 现代合同、证据、身份认证和公共服务大量依赖可信数字信息处理}]
    boundary_notes: 法律因辖区和时间变化；高金额、刑事、移民、时效或不可逆权利问题应尽早寻求合格法律帮助。

  - <<: *core_defaults
    id: hkm:skill:digital-security-media-information-literacy
    code: K20.07
    primary_type: skill
    labels: {zh: 数字安全、媒体、数据与信息素养, en: Digital Security, Media, Data and Information Literacy}
    definition: 管理账号设备权限备份和隐私，并用来源、证据、上下文与操纵迹象评估数字内容。
    core_questions: [信息和请求来自谁且能否独立验证, 账号数据设备的主要威胁与恢复路径是什么]
    primary_domain: hkm:domain:everyday-life-practical-agency
    related_subdomains: [hkm:subdomain:digital-media-information-literacy]
    roles: [method, practice, boundary]
    aims: [evaluate-norm, predict-warn, control-maintain]
    epistemic_modes: [empirical, interpretive, design]
    learning_priority: S
    prerequisites: [hkm:framework:everyday-risk-triage-escalation]
    connections: [{type: enables, target: hkm:skill:learning-reading-writing-knowledge-workflow, scope: 可信检索、版本、备份和引用是个人知识工作的基础设施}]
    boundary_notes: 单一“辟谣技巧”不能保证真假；高风险账号应使用多因素认证、恢复码和独立渠道核验，不向求助者索要密钥。

  - <<: *core_defaults
    id: hkm:skill:relationship-communication-consent-boundaries
    code: K20.08
    primary_type: skill
