  # D13 设计工程模板
  - <<: *core_defaults
    id: hkm:framework:needs-requirements-stakeholders
    code: K13.01
    primary_type: framework
    labels: {zh: 需求、要求与利益相关者, en: Needs, Requirements and Stakeholders}
    definition: 把模糊需要、使用情境、价值冲突和法规转成可追踪、可验证且可协商的系统要求。
    core_questions: [谁在何种情境下真正需要什么, 要求如何被验证且冲突如何处理]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:product-service-interaction-design]
    roles: [foundation, design, decision]
    aims: [identify-classify, design-create, decide-negotiate]
    epistemic_modes: [design, empirical, interpretive, normative]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:framework:engineering-constraints-trade-space, scope: 经确认的需要和要求定义设计可行域与评价标准}]
    boundary_notes: 用户表达的方案不必等于真实需要；被忽略的利益相关者、未来维护者和受外部性影响者也应进入边界。

  - <<: *core_defaults
    id: hkm:framework:engineering-constraints-trade-space
    code: K13.02
    primary_type: framework
    labels: {zh: 工程约束、权衡与设计空间, en: Engineering Constraints, Trade-offs and Design Space}
    definition: 组织物理、成本、时间、资源、人因、安全、环境与法规约束，并比较多目标方案而非追求单一最优。
    core_questions: [哪些是硬约束哪些是可协商目标, 权衡曲面和不可逆承诺在哪里]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:industrial-manufacturing-engineering, hkm:subdomain:product-service-interaction-design]
    roles: [foundation, representation, decision]
    aims: [optimize-allocate, design-create, decide-negotiate]
    epistemic_modes: [formal, design, normative]
    learning_priority: S
    prerequisites: [hkm:framework:needs-requirements-stakeholders]
    connections: [{type: constrains, target: hkm:framework:systems-architecture-interfaces, scope: 架构选择必须落在约束定义的可行设计空间内}]
    boundary_notes: 数值优化依赖目标函数与约束建模；不可量化价值不能因此被当作零。

  - <<: *core_defaults
    id: hkm:framework:systems-architecture-interfaces
    code: K13.03
    primary_type: framework
    labels: {zh: 系统架构、分解与接口, en: Systems Architecture, Decomposition and Interfaces}
    definition: 把整体功能分配到相互作用的组件、层级和接口，并控制耦合、依赖和变更传播。
    core_questions: [系统边界和模块如何划分, 接口如何传递物质能量信息与责任]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:mechanical-mechatronics-engineering, hkm:subdomain:electrical-electronic-engineering]
    roles: [representation, design, synthesis]
    aims: [explain-understand, design-create, control-maintain]
    epistemic_modes: [formal, causal, design, synthetic]
    learning_priority: S
    prerequisites: [hkm:framework:engineering-constraints-trade-space]
    connections: [{type: enables, target: hkm:framework:standards-modularity-interoperability, scope: 明确接口使模块化、兼容性和替换策略可实施}]
    boundary_notes: 分解会隐藏跨组件涌现行为；组织边界与技术边界不一致时容易形成无人负责的接口风险。

  - <<: *core_defaults
    id: hkm:model:engineering-models-safety-margins
    code: K13.04
    primary_type: model
    labels: {zh: 工程模型、近似与安全裕度, en: Engineering Models, Approximations and Safety Margins}
    definition: 用目的相关的物理、经验和计算模型估计载荷、响应与极限，并为不确定性保留合理裕度。
    core_questions: [模型保留和忽略了什么, 裕度覆盖哪些变异失效和未知]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:mechanical-mechatronics-engineering, hkm:subdomain:civil-structural-construction, hkm:subdomain:materials-engineering]
    roles: [representation, evidence, boundary]
    aims: [predict-warn, diagnose-abduce, design-create]
    epistemic_modes: [formal, empirical, causal, design]
    learning_priority: S
    prerequisites: [hkm:framework:engineering-constraints-trade-space]
    connections: [{type: enables, target: hkm:method:verification-validation-testing, scope: 模型预测给出可验证指标、包络与失效判据}]
    boundary_notes: 安全系数不能弥补错误失效模式或相关风险；高精度仿真仍需模型验证和现实确认。

  - <<: *core_defaults
    id: hkm:method:design-synthesis-prototyping
    code: K13.05
    primary_type: method
    labels: {zh: 设计综合、原型与迭代, en: Design Synthesis, Prototyping and Iteration}
    definition: 通过概念生成、形态组合、原型、试验和反馈把需求逐步转为可运行方案。
    core_questions: [如何产生不止一个可比较方案, 最小原型应消除哪项最大不确定性]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:product-service-interaction-design, hkm:subdomain:industrial-manufacturing-engineering]
    roles: [method, design, practice]
    aims: [design-create, diagnose-abduce, learn-transfer]
    epistemic_modes: [design, empirical, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:needs-requirements-stakeholders, hkm:framework:engineering-constraints-trade-space]
    connections: [{type: produces, target: hkm:method:verification-validation-testing, scope: 原型产生可用于验证要求和暴露未知的测试对象}]
    boundary_notes: 快速迭代不等于跳过危害分析；高风险系统的原型范围和试验环境必须受控。

  - <<: *core_defaults
    id: hkm:method:verification-validation-testing
    code: K13.06
    primary_type: method
    labels: {zh: 验证、确认与测试, en: Verification, Validation and Testing}
    definition: 分别检查实现是否符合规定、规定是否满足真实需要，并用分层证据覆盖正常、边界与失效情形。
    core_questions: [系统是否按规格构建, 规格和系统是否解决了正确的问题]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:bio-biomedical-engineering, hkm:subdomain:reliability-maintenance-safety-engineering]
    roles: [evidence, method, boundary]
    aims: [describe-measure, evaluate-norm, predict-warn]
    epistemic_modes: [empirical, formal, design]
    learning_priority: S
    prerequisites: [hkm:framework:needs-requirements-stakeholders, hkm:model:engineering-models-safety-margins]
    connections: [{type: challenges, target: hkm:framework:systems-architecture-interfaces, scope: 集成与接口测试可揭示架构假设和耦合错误}]
    boundary_notes: 通过测试只支持已覆盖条件；测试用例、测量链和验收阈值本身也需要审查。

  - <<: *core_defaults
    id: hkm:framework:manufacturing-process-capability
    code: K13.07
    primary_type: framework
    labels: {zh: 制造过程、变异与过程能力, en: Manufacturing Processes, Variation and Process Capability}
    definition: 连接材料转换、工艺窗口、公差、测量和统计控制，判断设计能否稳定经济地被实现。
    core_questions: [关键特性如何由过程产生, 变异是否在可接受能力范围内]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:chemical-process-engineering, hkm:subdomain:materials-engineering, hkm:subdomain:industrial-manufacturing-engineering]
    roles: [mechanism, design, evidence]
    aims: [describe-measure, optimize-allocate, control-maintain]
    epistemic_modes: [empirical, formal, design]
    learning_priority: A
    prerequisites: [hkm:model:engineering-models-safety-margins, hkm:method:design-synthesis-prototyping]
    connections: [{type: constrains, target: hkm:framework:systems-architecture-interfaces, scope: 工艺能力和装配公差反馈限制架构与接口设计}]
    boundary_notes: 原型可制造不等于规模化过程稳定；过程能力指标依赖分布、测量系统与受控状态。

  - <<: *core_defaults
    id: hkm:framework:reliability-failure-risk
    code: K13.08
    primary_type: framework
    labels: {zh: 可靠性、失效模式与工程风险, en: Reliability, Failure Modes and Engineering Risk}
    definition: 从危害、载荷、退化、故障传播和后果分析系统为何失效，以及如何预防、检测、容错和恢复。
    core_questions: [系统能以哪些方式失效且后果多大, 如何通过消除监测冗余和恢复降低风险]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:reliability-maintenance-safety-engineering]
    roles: [mechanism, boundary, design]
    aims: [predict-warn, diagnose-abduce, control-maintain]
    epistemic_modes: [empirical, causal, formal, design]
    learning_priority: S
    prerequisites: [hkm:framework:systems-architecture-interfaces, hkm:model:engineering-models-safety-margins]
    connections: [{type: enables, target: hkm:practice:operations-maintenance-repair, scope: 失效模式和风险优先级决定监测、维护与备件策略}]
    boundary_notes: 历史故障率不能覆盖未知共因、软件交互和极端环境；低概率高后果需独立审视。

  - <<: *core_defaults
    id: hkm:framework:sensing-feedback-control-automation
    code: K13.09
    primary_type: framework
    labels: {zh: 感知、反馈、控制与自动化, en: Sensing, Feedback, Control and Automation}
    definition: 通过测量系统状态、比较目标、调整输入和管理时延，使动态系统在扰动下保持或改变行为。
    core_questions: [哪些状态可观测可控, 反馈在时延噪声和约束下会稳定还是放大问题]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:mechanical-mechatronics-engineering, hkm:subdomain:electrical-electronic-engineering, hkm:subdomain:energy-power-engineering]
    roles: [mechanism, representation, design]
    aims: [predict-warn, control-maintain, optimize-allocate]
    epistemic_modes: [formal, empirical, causal, design]
    learning_priority: A
    prerequisites: [hkm:model:engineering-models-safety-margins, hkm:framework:systems-architecture-interfaces]
    connections: [{type: complements, target: hkm:framework:human-factors-usability-ergonomics, scope: 自动化边界和告警设计必须匹配人的能力、负荷与接管行为}]
    boundary_notes: 自动化会转移而非消除责任和风险；传感偏差、时延、饱和和模式混淆可使反馈失稳。

  - <<: *core_defaults
    id: hkm:framework:human-factors-usability-ergonomics
    code: K13.10
    primary_type: framework
    labels: {zh: 人因、可用性与工效学, en: Human Factors, Usability and Ergonomics}
    definition: 把人的知觉、认知、身体、协作和局限作为系统组成，设计任务、界面、环境和错误防护。
    core_questions: [系统要求人感知记忆判断和动作什么, 设计如何减少可预见误用与负荷]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:product-service-interaction-design, hkm:subdomain:reliability-maintenance-safety-engineering, hkm:subdomain:architecture-built-environment]
    roles: [design, evidence, boundary]
    aims: [describe-measure, design-create, control-maintain]
    epistemic_modes: [empirical, design, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:needs-requirements-stakeholders]
    connections: [{type: constrains, target: hkm:method:design-synthesis-prototyping, scope: 真实使用能力和情境应进入原型任务与界面迭代}]
    boundary_notes: “操作员错误”常是系统设计、训练和组织条件的症状；平均用户不能代表边缘能力和无障碍需求。

  - <<: *core_defaults
    id: hkm:practice:operations-maintenance-repair
    code: K13.11
    primary_type: practice
    labels: {zh: 运行、维护、维修与资产管理, en: Operations, Maintenance, Repair and Asset Management}
    definition: 通过状态监测、预防与纠正维护、备件、工单、维修和知识回馈保持系统全寿命可用。
    core_questions: [何时检查维护更换或修复, 运行经验如何反馈设计和风险控制]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:reliability-maintenance-safety-engineering, hkm:subdomain:industrial-manufacturing-engineering, hkm:subdomain:transport-mobility-logistics-engineering]
    roles: [practice, decision, evidence]
    aims: [diagnose-abduce, control-maintain, optimize-allocate]
    epistemic_modes: [empirical, causal, design, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:reliability-failure-risk]
    connections: [{type: produces, target: hkm:framework:lifecycle-sustainability-circularity, scope: 运行寿命、维修性和退化数据改变生命周期成本与环境评价}]
    boundary_notes: 延后维护可能形成不可见风险债务；按期更换也不必然优于状态维护，策略应匹配失效机制。

  - <<: *core_defaults
    id: hkm:framework:lifecycle-sustainability-circularity
    code: K13.12
    primary_type: framework
    labels: {zh: 全生命周期、可持续性与循环设计, en: Lifecycle, Sustainability and Circular Design}
    definition: 从原料、制造、运输、使用、维护到退役比较成本、能耗、排放、毒性、耐久和再利用路径。
    core_questions: [影响是否只是被转移到另一阶段地区或群体, 如何延寿减量复用修复和安全回收]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:environmental-engineering, hkm:subdomain:materials-engineering, hkm:subdomain:industrial-manufacturing-engineering]
    roles: [synthesis, design, boundary]
    aims: [evaluate-norm, design-create, optimize-allocate]
    epistemic_modes: [empirical, causal, normative, design, synthetic]
    learning_priority: A
    prerequisites: [hkm:framework:engineering-constraints-trade-space, hkm:practice:operations-maintenance-repair]
    connections: [{type: constrains, target: hkm:method:design-synthesis-prototyping, scope: 生命周期外部性和退役路径应前置进入方案选择}]
    boundary_notes: 生命周期结果对功能单位、系统边界和数据假设敏感；可回收不等于现实中被回收。

  - <<: *core_defaults
    id: hkm:framework:standards-modularity-interoperability
    code: K13.13
    primary_type: framework
    labels: {zh: 标准、模块化与互操作性, en: Standards, Modularity and Interoperability}
    definition: 通过共享接口、测试规范、兼容规则和模块边界支持规模化协作、替换、维修与生态系统连接。
    core_questions: [哪些接口应稳定标准化, 模块独立性与系统整体优化如何平衡]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:electrical-electronic-engineering, hkm:subdomain:industrial-manufacturing-engineering]
