    aims: [design-create, control-maintain, learn-transfer]
    epistemic_modes: [formal, design, historical]
    learning_priority: B
    prerequisites: [hkm:framework:systems-architecture-interfaces]
    connections: [{type: enables, target: hkm:practice:operations-maintenance-repair, scope: 可替换模块、文档和通用接口提高诊断维修与备件可得性}]
    boundary_notes: 标准可形成锁定和权力；互操作测试合格不保证语义、组织流程或安全目标完全一致。

  - <<: *core_defaults
    id: hkm:practice:engineering-project-configuration-change
    code: K13.14
    primary_type: practice
    labels: {zh: 工程项目、配置与变更管理, en: Engineering Project, Configuration and Change Management}
    definition: 管理范围、依赖、版本、接口、证据、供应和决策记录，使复杂系统在多人协作中保持可追踪一致。
    core_questions: [当前权威配置和依据是什么, 变更会传播到哪些要求接口测试和维护活动]
    primary_domain: hkm:domain:engineering-technology-design
    related_subdomains: [hkm:subdomain:engineering-science-systems, hkm:subdomain:industrial-manufacturing-engineering]
