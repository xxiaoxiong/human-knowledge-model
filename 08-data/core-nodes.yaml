    prerequisites: []
    connections: [{type: enables, target: hkm:framework:sensory-transduction-perceptual-inference, scope: 感觉系统把物理刺激转换为神经编码并在回路中整合}]
    boundary_notes: 神经相关不自动证明心理功能的充分或必要机制；脑区标签常掩盖分布式和任务依赖加工。

  - <<: *core_defaults
    id: hkm:framework:sensory-transduction-perceptual-inference
    code: K06.02
    primary_type: framework
    labels: {zh: 感觉转导与知觉推断, en: Sensory Transduction and Perceptual Inference}
    definition: 研究刺激如何经感受器编码，并由先验、注意、情境和多模态整合形成对外界与身体状态的知觉估计。
    core_questions: [感觉信号中的信息和噪声如何被转换整合, 知觉如何结合当前证据先验和行动目标]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:perception-sensation]
    roles: [mechanism, representation, evidence]
    aims: [explain-understand, diagnose-abduce, predict-warn]
    epistemic_modes: [empirical, causal, formal]
    learning_priority: S
    prerequisites: [hkm:framework:neural-coding-circuits-plasticity]
    connections: [{type: enables, target: hkm:framework:motor-control-embodied-action, scope: 行动选择依赖外界身体与目标状态的持续知觉估计}]
    boundary_notes: 知觉不是被动复制也不是任意建构；实验错觉需区分适应性推断、任务策略与测量伪影。

  - <<: *core_defaults
    id: hkm:framework:motor-control-embodied-action
    code: K06.03
    primary_type: framework
    labels: {zh: 运动控制与具身行动, en: Motor Control and Embodied Action}
    definition: 用内部模型、反馈、身体力学、动作可供性和感知行动循环解释目标如何转为协调运动与技能。
    core_questions: [系统如何在延迟噪声和身体约束下控制动作, 身体与环境怎样参与认知和问题求解]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:action-motor-embodied-cognition]
    roles: [mechanism, practice, representation]
    aims: [control-maintain, explain-understand, learn-transfer]
    epistemic_modes: [empirical, causal, embodied]
    learning_priority: A
    prerequisites: [hkm:framework:neural-coding-circuits-plasticity, hkm:framework:sensory-transduction-perceptual-inference]
    connections: [{type: complements, target: hkm:framework:learning-memory-reinforcement-consolidation, scope: 技能形成需要动作反馈误差学习和长期巩固}]
    boundary_notes: 运动表现受疼痛疲劳环境与设备影响；具身解释不能排除抽象表征和社会符号的作用。

  - <<: *core_defaults
    id: hkm:framework:learning-memory-reinforcement-consolidation
    code: K06.04
    primary_type: framework
    labels: {zh: 学习、记忆、强化与巩固, en: Learning, Memory, Reinforcement and Consolidation}
    definition: 区分工作、情景、语义、程序与习惯系统，连接预测误差、强化、检索、遗忘、睡眠和再巩固过程。
    core_questions: [经验如何改变表征策略与行为, 何种编码检索反馈和间隔条件支持持久迁移]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:learning-memory]
    roles: [foundation, mechanism, practice]
    aims: [learn-transfer, explain-understand, control-maintain]
    epistemic_modes: [empirical, causal, formal]
    learning_priority: S
    prerequisites: [hkm:framework:neural-coding-circuits-plasticity, hkm:framework:sensory-transduction-perceptual-inference]
    connections: [{type: enables, target: hkm:framework:reasoning-judgment-decision, scope: 推理与决策使用从经验中学习并可被检索的表征和价值估计}]
    boundary_notes: 熟悉感和流畅感不等于准确记忆；记忆具有重构性，单一学习风格标签缺乏稳健支持。

  - <<: *core_defaults
    id: hkm:framework:reasoning-judgment-decision
    code: K06.05
    primary_type: framework
    labels: {zh: 推理、判断与决策, en: Reasoning, Judgment and Decision-Making}
    definition: 比较启发式、规则、概率推断、价值计算和证据累积，解释人在有限信息、时间和计算资源下如何选择。
    core_questions: [判断依赖哪些表征证据和默认启发式, 决策目标概率时间偏好与社会约束如何共同作用]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:reasoning-judgment-decision]
    roles: [decision, mechanism, boundary]
    aims: [decide-negotiate, diagnose-abduce, predict-warn]
    epistemic_modes: [empirical, causal, formal]
    learning_priority: S
    prerequisites: [hkm:framework:learning-memory-reinforcement-consolidation]
    connections: [{type: enables, target: hkm:framework:behavior-change-self-regulation-habits, scope: 自我调节把决策意图转化为环境线索反馈和重复行动}]
    boundary_notes: 偏差标签需相对于任务目标和生态环境评价；规范理性模型不等于对真实心理机制的描述。

  - <<: *core_defaults
    id: hkm:framework:emotion-motivation-affect-regulation
    code: K06.06
    primary_type: framework
    labels: {zh: 情绪、动机与情感调节, en: Emotion, Motivation and Affect Regulation}
    definition: 连接需要、奖励、唤醒、评价、身体信号、行动倾向和社会表达，解释情绪如何引导注意、学习与目标追求。
    core_questions: [情绪由哪些评价身体和情境过程构成, 动机与调节策略何时支持或损害长期目标]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:emotion-motivation-affect]
    roles: [mechanism, decision, boundary]
    aims: [explain-understand, control-maintain, predict-warn]
    epistemic_modes: [empirical, causal, embodied, interpretive]
    learning_priority: A
    prerequisites: [hkm:framework:neural-coding-circuits-plasticity, hkm:framework:learning-memory-reinforcement-consolidation]
    connections: [{type: influences, target: hkm:framework:reasoning-judgment-decision, scope: 情绪和动机改变注意证据权重风险估计和时间偏好}]
    boundary_notes: 情绪不是理性的反面也不是纯生理读数；调节目标需区分短期压制、适应表达和情境改变。

  - <<: *core_defaults
    id: hkm:framework:consciousness-self-agency-metacognition
    code: K06.07
    primary_type: framework
    labels: {zh: 意识、自我、能动性与元认知, en: Consciousness, Self, Agency and Metacognition}
    definition: 研究主观体验、全局可用性、自我模型、行动归因、意向控制和对自身认知置信度的监测。
    core_questions: [什么信息进入可报告体验和灵活控制, 自我感能动感与元认知准确性如何形成]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:consciousness-self-agency]
    roles: [synthesis, representation, boundary]
    aims: [explain-understand, describe-measure, evaluate-norm]
    epistemic_modes: [empirical, formal, interpretive]
    learning_priority: B
    prerequisites: [hkm:framework:sensory-transduction-perceptual-inference, hkm:framework:motor-control-embodied-action, hkm:framework:learning-memory-reinforcement-consolidation]
    connections: [{type: complements, target: hkm:framework:behavior-change-self-regulation-habits, scope: 元认知监测支持目标修正但不能单独保证行动控制}]
    boundary_notes: 意识理论对机制与测量存在竞争；语言报告、行为指标和神经指标各有盲区，不应循环定义。

  - <<: *core_defaults
    id: hkm:framework:development-lifespan-adaptation
    code: K06.08
    primary_type: framework
    labels: {zh: 心理发展、生命历程与适应, en: Psychological Development, Lifespan and Adaptation}
    definition: 连接脑身体成熟、依恋、社会化、语言、认知变化、身份与老化，研究个体在关系和制度环境中的连续与转变。
    core_questions: [能力和需求如何随生命阶段与经验共同变化, 早期条件通过哪些可塑与累积路径影响后来发展]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:development-lifespan]
    roles: [mechanism, synthesis, boundary]
    aims: [explain-understand, predict-warn, control-maintain]
    epistemic_modes: [empirical, causal, historical]
    learning_priority: A
    prerequisites: [hkm:framework:neural-coding-circuits-plasticity, hkm:framework:learning-memory-reinforcement-consolidation]
    connections: [{type: enables, target: hkm:framework:individual-differences-personality-measurement, scope: 个体差异需要放在发展轨迹情境和测量时间中解释}]
    boundary_notes: 年龄平均趋势不能决定个体能力；发展阶段模型需避免把特定文化和历史样本当作普遍规范。

  - <<: *core_defaults
    id: hkm:framework:individual-differences-personality-measurement
    code: K06.09
    primary_type: framework
    additional_types: [measurement]
    labels: {zh: 个体差异、人格与心理测量, en: Individual Differences, Personality and Psychological Measurement}
    definition: 用特质、能力、状态、情境交互和潜变量测量描述稳定差异，并评估信度、效度、公平性与预测边界。
    core_questions: [测量分数反映何种构念且跨群体可比吗, 稳定特质和具体情境如何共同预测行为]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:personality-individual-differences]
    roles: [representation, evidence, boundary]
    aims: [describe-measure, identify-classify, predict-warn]
    epistemic_modes: [empirical, formal]
    learning_priority: B
    prerequisites: [hkm:framework:learning-memory-reinforcement-consolidation, hkm:framework:development-lifespan-adaptation]
    connections: [{type: constrains, target: hkm:framework:social-cognition-culture-norms, scope: 群体情境和文化规范影响特质表达与量表解释}]
    boundary_notes: 心理量表不是人的本质标签；测量不变性、刻板印象风险和用途授权必须审查。

  - <<: *core_defaults
    id: hkm:framework:social-cognition-culture-norms
    code: K06.10
    primary_type: framework
    labels: {zh: 社会认知、文化与规范, en: Social Cognition, Culture and Norms}
    definition: 研究他心推断、归因、身份、规范学习、合作竞争、权力和文化模型如何塑造知觉、判断与互动。
    core_questions: [个体如何推断他人意图并学习群体规范, 身份权力与文化语境如何改变心理过程和行为]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:social-cultural-psychology]
    roles: [mechanism, synthesis, boundary]
    aims: [explain-understand, predict-warn, decide-negotiate]
    epistemic_modes: [empirical, causal, interpretive, comparative]
    learning_priority: A
    prerequisites: [hkm:framework:sensory-transduction-perceptual-inference, hkm:framework:reasoning-judgment-decision, hkm:framework:emotion-motivation-affect-regulation]
    connections: [{type: influences, target: hkm:framework:language-representation-acquisition-interaction, scope: 语言学习和使用嵌入共同注意身份规范与互动目的}]
    boundary_notes: 样本文化和实验情境限制普遍化；群体差异不能无视群内变异、历史权力与测量偏差。

  - <<: *core_defaults
    id: hkm:framework:language-representation-acquisition-interaction
    code: K06.11
    primary_type: framework
    labels: {zh: 语言表征、习得与互动, en: Language Representation, Acquisition and Interaction}
    definition: 连接语音词汇句法语义语用、预测加工、共同注意和社会互动，解释语言理解产生与习得。
    core_questions: [语言形式如何编码并在语境中确定意义, 儿童和成人怎样从输入互动与反馈中习得语言]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:language-cognition]
    roles: [representation, mechanism, synthesis]
    aims: [explain-understand, learn-transfer, describe-measure]
    epistemic_modes: [empirical, formal, interpretive]
    learning_priority: S
    prerequisites: [hkm:framework:sensory-transduction-perceptual-inference, hkm:framework:learning-memory-reinforcement-consolidation]
    connections: [{type: complements, target: hkm:framework:social-cognition-culture-norms, scope: 语言既承载社会文化规范也在互动中持续改变它们}]
    boundary_notes: 语言能力不等于单一标准语熟练度；双语、方言、手语和辅助沟通需要避免缺陷化视角。

  - <<: *core_defaults
    id: hkm:framework:behavior-change-self-regulation-habits
    code: K06.12
    primary_type: framework
    labels: {zh: 行为改变、自我调节与习惯, en: Behavior Change, Self-Regulation and Habits}
    definition: 用目标、能力、机会、动机、线索、强化、承诺、反馈和环境设计解释行为启动、维持、复发与改变。
    core_questions: [目标行为受哪些能力机会动机和环境摩擦限制, 如何用最小可行干预形成反馈并处理复发]
    primary_domain: hkm:domain:mind-brain-behavior
    related_subdomains: [hkm:subdomain:behavior-change-self-regulation]
    roles: [practice, design, decision]
    aims: [control-maintain, design-create, learn-transfer]
    epistemic_modes: [empirical, causal, design, embodied]
    learning_priority: S
    prerequisites: [hkm:framework:learning-memory-reinforcement-consolidation, hkm:framework:reasoning-judgment-decision, hkm:framework:emotion-motivation-affect-regulation]
    connections: [{type: uses, target: hkm:framework:consciousness-self-agency-metacognition, scope: 元认知和能动感可支持监测选择与复盘但需配合环境和社会资源}]
    boundary_notes: 行为问题不应自动归咎意志力；精神健康、成瘾、贫困、残障和强制环境可能需要专业或结构性干预。

  # D10 社会制度模板
  - <<: *core_defaults
    id: hkm:concept:scarcity-opportunity-cost-tradeoffs
    code: K10.01
    primary_type: concept
    labels: {zh: 稀缺、机会成本与权衡, en: Scarcity, Opportunity Cost and Trade-offs}
    definition: 以有限资源和互斥选择为起点，比较采取某方案所放弃的最佳替代及其分配后果。
    core_questions: [真正稀缺的资源是什么, 选择该方案放弃了什么且由谁承担]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:public-labor-development-environment-economics, hkm:subdomain:operations-supply-chains-quality]
    roles: [foundation, decision, boundary]
    aims: [optimize-allocate, decide-negotiate, evaluate-norm]
    epistemic_modes: [formal, empirical, normative]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:framework:marginal-choice-equilibrium-welfare, scope: 机会成本定义边际比较和可行选择集}]
    boundary_notes: 稀缺不决定分配应当如何；货币价格可能遗漏权力、公共价值、不可逆损害和无偿劳动。

  - <<: *core_defaults
    id: hkm:framework:marginal-choice-equilibrium-welfare
    code: K10.02
    primary_type: framework
    labels: {zh: 边际选择、均衡与福利, en: Marginal Choice, Equilibrium and Welfare}
    definition: 用偏好、边际收益成本、约束和相互一致的选择分析个体行为、市场结果与福利变化。
    core_questions: [在约束下多做一单位的净效果是什么, 个体最优如何形成或不能形成社会可取结果]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:behavioral-experimental-economics]
    roles: [foundation, representation, decision]
    aims: [explain-understand, predict-warn, optimize-allocate]
    epistemic_modes: [formal, empirical, normative]
    learning_priority: S
    prerequisites: [hkm:concept:scarcity-opportunity-cost-tradeoffs]
    connections: [{type: depends-on, target: hkm:framework:information-asymmetry-signals, scope: 均衡预测随信息集合和信念结构改变}]
    boundary_notes: 均衡是相容性条件而非道德认可或动态稳定保证；偏好也可能受制度和社会塑造。

  - <<: *core_defaults
    id: hkm:framework:incentives-strategy-mechanism-design
    code: K10.03
    primary_type: framework
    labels: {zh: 激励、策略互动与机制设计, en: Incentives, Strategic Interaction and Mechanism Design}
    definition: 研究多主体在规则、预期和他人选择下的策略行为，以及如何设计规则使私人行动接近集体目标。
    core_questions: [规则如何改变行为而非只改变口号, 个体最优与集体结果为何偏离]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:industrial-information-digital-economics, hkm:subdomain:organization-design-governance]
    roles: [mechanism, design, decision]
    aims: [explain-understand, design-create, decide-negotiate]
    epistemic_modes: [formal, empirical, causal, design]
    learning_priority: S
    prerequisites: [hkm:framework:marginal-choice-equilibrium-welfare]
    connections: [{type: complements, target: hkm:framework:institutions-property-transaction-costs, scope: 激励分析需要制度规则和执行成本才能映射现实}]
    boundary_notes: 人不总是稳定自利的优化者；规范、身份、有限理性和权力可改变策略空间与收益。

  - <<: *core_defaults
    id: hkm:framework:information-asymmetry-signals
    code: K10.04
    primary_type: framework
    labels: {zh: 信息、不对称、信号与筛选, en: Information, Asymmetry, Signaling and Screening}
    definition: 分析主体拥有不同信息时的逆向选择、道德风险、信号、筛选和委托代理问题。
    core_questions: [谁知道什么且谁不能验证, 如何设计可信信号监督和信息披露]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:industrial-information-digital-economics, hkm:subdomain:finance-investment-risk, hkm:subdomain:marketing-consumer-service, hkm:subdomain:organization-design-governance]
    roles: [mechanism, representation, design]
    aims: [diagnose-abduce, predict-warn, design-create]
    epistemic_modes: [formal, causal, empirical]
    learning_priority: S
    prerequisites: [hkm:framework:marginal-choice-equilibrium-welfare]
    connections: [{type: explains, target: hkm:framework:markets-competition-platforms, scope: 搜寻成本与信息不对称改变价格形成、市场进入和平台权力}]
    boundary_notes: 信息更多不必然更好；注意力、隐私、可理解性和策略性披露会改变信息价值。

  - <<: *core_defaults
    id: hkm:framework:institutions-property-transaction-costs
    code: K10.05
    primary_type: framework
    labels: {zh: 制度、产权与交易成本, en: Institutions, Property Rights and Transaction Costs}
    definition: 用正式与非正式规则、权利束、执行能力和协调成本解释活动为何由市场、组织、家庭或公共部门承载。
    core_questions: [哪些规则界定权利责任与可执行承诺, 为何这种治理结构比替代方案更可行]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:public-labor-development-environment-economics, hkm:subdomain:industrial-information-digital-economics, hkm:subdomain:organization-design-governance]
    roles: [foundation, mechanism, synthesis]
    aims: [explain-understand, diagnose-abduce, design-create]
    epistemic_modes: [empirical, causal, historical, design]
    learning_priority: S
    prerequisites: [hkm:concept:scarcity-opportunity-cost-tradeoffs]
    connections: [{type: explains, target: hkm:framework:organization-authority-governance, scope: 交易成本和权利配置帮助解释组织边界与治理安排}]
    boundary_notes: 制度效果依赖执行、权力、文化与历史；“产权清晰”不是单一制度处方。

  - <<: *core_defaults
    id: hkm:framework:markets-competition-platforms
    code: K10.06
    primary_type: framework
    labels: {zh: 市场结构、竞争与平台, en: Market Structure, Competition and Platforms}
    definition: 研究进入退出、集中度、差异化、网络效应和定价权如何塑造市场绩效与创新。
    core_questions: [谁能进入并影响价格规则, 网络效应和规模经济何时产生锁定或效率]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:industrial-information-digital-economics, hkm:subdomain:strategy-competition-entrepreneurship]
    roles: [mechanism, representation, evidence]
    aims: [identify-classify, explain-understand, predict-warn]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: A
    prerequisites: [hkm:framework:marginal-choice-equilibrium-welfare, hkm:framework:information-asymmetry-signals]
    connections: [{type: constrains, target: hkm:framework:strategy-capabilities-innovation, scope: 产业结构和平台规则改变企业可行战略与创新收益}]
    boundary_notes: 集中度只是竞争线索；相关市场界定、潜在进入、质量、创新和买方权力都可能改变判断。

