    connections: [{type: constrains, target: hkm:method:design-synthesis-prototyping, scope: 生命周期外部性和退役路径应前置进入方案选择}]
    boundary_notes: 生命周期结果对功能单位、系统边界和数据假设敏感；可回收不等于现实中被回收。

  - <<: *core_defaults
    id: hkm:framework:standards-modularity-interoperability
