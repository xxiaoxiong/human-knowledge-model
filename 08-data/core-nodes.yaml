    core_questions: [哪些变换不改变可观察规律, 对称破缺如何产生可见结构]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:classical-mechanics-fields-waves, hkm:subdomain:quantum-atomic-molecular-physics, hkm:subdomain:particle-nuclear-physics]
