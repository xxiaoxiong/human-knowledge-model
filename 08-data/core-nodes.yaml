    epistemic_modes: [empirical, causal, formal]
    learning_priority: S
    prerequisites: [hkm:framework:neural-coding-circuits-plasticity]
    connections: [{type: enables, target: hkm:framework:motor-control-embodied-action, scope: 行动选择依赖外界身体与目标状态的持续知觉估计}]
    boundary_notes: 知觉不是被动复制也不是任意建构；实验错觉需区分适应性推断、任务策略与测量伪影。

