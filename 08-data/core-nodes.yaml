    code: K03.02
    primary_type: law-principle
    labels: {zh: 守恒律与收支平衡, en: Conservation Laws and Balances}
    definition: 用系统边界内的存量、通量、源与汇表述质量、能量、动量、电荷等量如何变化。
    core_questions: [什么在给定边界和相互作用下守恒, 观察到的变化来自通量还是源汇]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:classical-mechanics-fields-waves, hkm:subdomain:thermodynamics-statistical-physics, hkm:subdomain:particle-nuclear-physics]
