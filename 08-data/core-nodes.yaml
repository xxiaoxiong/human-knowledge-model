schema_version: 0.1.0
model_version: 0.3.0-draft
description: 领域核心骨架内容节点；当前覆盖十二个领域，其余领域按同一质量门槛持续扩展。
published_domains: [D01, D02, D03, D04, D05, D06, D07, D08, D09, D10, D13, D20]

defaults: &core_defaults
  status: active
  version: 0.3.0-draft

core_nodes:
  # D01 元知识与探究骨架
  - <<: *core_defaults
    id: hkm:framework:knowledge-justification-truth
    code: K01.01
    primary_type: framework
    labels: {zh: 知识、证成与真理框架, en: Knowledge, Justification and Truth}
    definition: 区分信念、证据、证成、可靠性与真理条件，并分析认知主体如何在不确定和可错条件下形成可辩护判断。
    core_questions: [什么使一个信念有资格被称为知识, 证据与可靠过程如何支持或削弱判断]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:epistemology-knowledge]
    roles: [foundation, evidence, boundary]
    aims: [evaluate-norm, explain-understand, diagnose-abduce]
    epistemic_modes: [formal, interpretive, normative]
    learning_priority: S
    prerequisites: []
    connections: [{type: enables, target: hkm:method:argument-analysis-dialectical-inquiry, scope: 对证成和证据的区分为论证重构与批判提供评价标准}]
    boundary_notes: 知识分析存在内在主义、外在主义与社会认识论等竞争方案；不可把确信程度直接当作真实性或正当性。

  - <<: *core_defaults
    id: hkm:framework:ontology-identity-modality
    code: K01.02
    primary_type: framework
    labels: {zh: 存在、同一性与模态框架, en: Ontology, Identity and Modality}
    definition: 用实体、属性、关系、过程、部分整体、可能性与必然性等范畴澄清我们承诺何种存在及其持续条件。
    core_questions: [理论承诺了哪些存在者与关系, 对象跨时间和反事实情境保持同一需要什么条件]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:metaphysics-ontology]
    roles: [foundation, representation, boundary]
    aims: [identify-classify, explain-understand, learn-transfer]
    epistemic_modes: [formal, interpretive]
    learning_priority: A
    prerequisites: [hkm:framework:knowledge-justification-truth]
    connections: [{type: enables, target: hkm:framework:knowledge-organization-ontology-design, scope: 形而上范畴为知识表示中的类别关系和身份条件提供概念资源}]
    boundary_notes: 本体承诺依赖语言、理论与解释目的；概念分类的便利性不自动证明世界具有同样的唯一切分。

  - <<: *core_defaults
    id: hkm:method:argument-analysis-dialectical-inquiry
    code: K01.03
    primary_type: method
    labels: {zh: 论证分析与辩证探究, en: Argument Analysis and Dialectical Inquiry}
    definition: 重构前提、结论、隐含假设和反例，区分演绎有效性、归纳强度与溯因解释，并通过异议修正主张。
    core_questions: [结论依赖哪些明示或隐含前提, 什么反例证据或替代解释会改变判断]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:argumentation-critical-inquiry]
    roles: [method, evidence, boundary]
    aims: [diagnose-abduce, evaluate-norm, decide-negotiate]
    epistemic_modes: [formal, interpretive, comparative]
    learning_priority: S
    prerequisites: [hkm:framework:knowledge-justification-truth]
    connections: [{type: enables, target: hkm:framework:ethical-reasoning-moral-pluralism, scope: 伦理分歧需要区分事实前提价值前提与推理结构}]
    boundary_notes: 形式有效不保证前提真实或相关；修辞说服、身份权威与论证质量必须分别判断。

  - <<: *core_defaults
    id: hkm:framework:ethical-reasoning-moral-pluralism
    code: K01.04
    primary_type: framework
    labels: {zh: 伦理推理与道德多元, en: Ethical Reasoning and Moral Pluralism}
    definition: 综合后果、义务、权利、德性、关怀、公正与情境，识别行动受影响者、可接受理由和不可逾越边界。
    core_questions: [谁受到怎样的利益风险与权利影响, 冲突价值之间哪些取舍可被公开辩护]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:ethics-moral-philosophy]
    roles: [foundation, decision, boundary]
    aims: [evaluate-norm, decide-negotiate, control-maintain]
    epistemic_modes: [normative, interpretive, comparative]
    learning_priority: S
    prerequisites: [hkm:method:argument-analysis-dialectical-inquiry]
    connections: [{type: enables, target: hkm:framework:justice-legitimacy-rights, scope: 公共制度评价把个体伦理理由扩展到权利分配与合法强制}]
    boundary_notes: 伦理框架不能机械输出唯一答案；事实不确定、权力差异、文化语境和不可逆伤害需显式呈现。

  - <<: *core_defaults
    id: hkm:framework:value-aesthetic-life-evaluation
    code: K01.05
    primary_type: framework
    labels: {zh: 价值、审美与生活评价, en: Value, Aesthetic and Life Evaluation}
    definition: 分析何物值得追求、何种体验具有审美意义，以及幸福、成就、关系、自主和意义如何构成对生活的评价。
    core_questions: [评价对象依赖哪些价值标准与感受结构, 良好生活的不同组成如何冲突或互补]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:value-aesthetics-life-philosophy]
    roles: [foundation, synthesis, decision]
    aims: [evaluate-norm, explain-understand, decide-negotiate]
    epistemic_modes: [normative, interpretive, embodied]
    learning_priority: B
    prerequisites: [hkm:framework:ethical-reasoning-moral-pluralism]
    connections: [{type: complements, target: hkm:framework:reflexive-inquiry-worldview-audit, scope: 生活选择的反思既需要价值澄清也需要检视世界观和社会条件}]
    boundary_notes: 主观偏好、社会地位信号与审美价值不等同；价值评价可有理由约束但通常不能简化为单一量表。

  - <<: *core_defaults
    id: hkm:framework:scientific-explanation-theory-change
    code: K01.06
    primary_type: framework
    labels: {zh: 科学解释、模型与理论变迁, en: Scientific Explanation, Models and Theory Change}
    definition: 比较因果、机制、统一、统计与模型型解释，考察观察负载、理想化、证伪、确认和研究纲领如何推动理论变化。
    core_questions: [解释为何有效且依赖哪些理想化, 新证据应促使参数修正模型替换还是研究问题重构]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:philosophy-science-technology-methodology]
    roles: [foundation, synthesis, boundary]
    aims: [explain-understand, evaluate-norm, learn-transfer]
    epistemic_modes: [historical, interpretive, comparative, formal]
    learning_priority: S
    prerequisites: [hkm:framework:knowledge-justification-truth, hkm:method:argument-analysis-dialectical-inquiry]
    connections: [{type: enables, target: hkm:framework:metascience-reproducibility-incentives, scope: 对模型证据和理论变化的理解为研究实践评价提供规范基线}]
    boundary_notes: 单次反例通常不能脱离辅助假设和测量条件裁决理论；科学方法不是跨领域完全相同的固定步骤。

  - <<: *core_defaults
    id: hkm:model:mind-language-reference
    code: K01.07
    primary_type: model
    labels: {zh: 心智、语言与指称模型, en: Mind, Language and Reference}
    definition: 连接意识内容、意向性、概念、语言使用、意义、指称与社会实践，解释思想如何关于世界并可被交流。
    core_questions: [心理内容和语言表达如何获得意义, 私人体验与公共规则如何共同支持理解]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:philosophy-mind-language]
    roles: [representation, mechanism, boundary]
    aims: [explain-understand, identify-classify, learn-transfer]
    epistemic_modes: [interpretive, formal, comparative]
    learning_priority: A
    prerequisites: [hkm:framework:ontology-identity-modality]
    connections: [{type: complements, target: hkm:framework:knowledge-organization-ontology-design, scope: 形式本体需要与自然语言语境多义性和使用规则相互校正}]
    boundary_notes: 心灵哲学立场和意义理论高度争议；语义模型的预测成功不自动解决意识本体或理解是否真实的问题。

  - <<: *core_defaults
    id: hkm:framework:justice-legitimacy-rights
    code: K01.08
    primary_type: framework
    labels: {zh: 正义、合法性与权利框架, en: Justice, Legitimacy and Rights}
    definition: 评价制度如何分配权利、机会、资源、负担与政治声音，以及何种权威和强制可被受影响者合理接受。
    core_questions: [制度的收益风险和话语权如何分配, 权威的来源程序边界与救济是否正当]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:social-political-legal-philosophy]
    roles: [foundation, decision, boundary]
    aims: [evaluate-norm, decide-negotiate, optimize-allocate]
    epistemic_modes: [normative, historical, comparative]
    learning_priority: A
    prerequisites: [hkm:framework:ethical-reasoning-moral-pluralism]
    connections: [{type: complements, target: hkm:method:comparative-philosophy-contextual-translation, scope: 正义与合法性概念需在不同历史制度和思想传统之间谨慎翻译}]
    boundary_notes: 合法、民主或多数支持不自动等于正义；抽象原则需检验其对边缘群体和现实权力关系的影响。

  - <<: *core_defaults
    id: hkm:method:comparative-philosophy-contextual-translation
    code: K01.09
    primary_type: method
    labels: {zh: 比较哲学与语境化翻译, en: Comparative Philosophy and Contextual Translation}
    definition: 在不预设单一传统为尺度的前提下，比较概念、问题、论证形式、修行实践与历史语境，建立可修正的对应关系。
    core_questions: [概念在原传统中解决什么问题并嵌入何种实践, 跨传统对应是等同近似类比还是不可通约]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:comparative-philosophy-knowledge-traditions]
    roles: [method, synthesis, boundary]
    aims: [identify-classify, learn-transfer, evaluate-norm]
    epistemic_modes: [comparative, historical, interpretive]
    learning_priority: B
    prerequisites: [hkm:method:argument-analysis-dialectical-inquiry]
    connections: [{type: enables, target: hkm:framework:reflexive-inquiry-worldview-audit, scope: 多传统比较暴露默认范畴和问题设定的地方性}]
    boundary_notes: 相似译词可能掩盖历史实践差异；比较既要避免把差异异国化，也要避免用熟悉范畴抹平差异。

  - <<: *core_defaults
    id: hkm:framework:metascience-reproducibility-incentives
    code: K01.10
    primary_type: framework
    labels: {zh: 元科学、可复现性与研究激励, en: Metascience, Reproducibility and Research Incentives}
    definition: 把研究设计、测量、统计选择、发表机制、利益冲突、开放实践和纠错制度视为共同塑造证据可靠性的系统。
    core_questions: [结果能否在透明条件下复核重复或再现, 奖励结构如何影响选题分析发表与纠错]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:metascience-research-integrity]
    roles: [evidence, method, boundary]
    aims: [evaluate-norm, diagnose-abduce, control-maintain]
    epistemic_modes: [empirical, formal, normative]
    learning_priority: S
    prerequisites: [hkm:framework:scientific-explanation-theory-change]
    connections: [{type: constrains, target: hkm:framework:knowledge-organization-ontology-design, scope: 知识组织应保留来源版本不确定性撤回和争议状态}]
    boundary_notes: 不可复现有技术、统计、样本与理论多种原因；开放数据也受隐私、安全、同意和知识主权限制。

  - <<: *core_defaults
    id: hkm:framework:knowledge-organization-ontology-design
    code: K01.11
    primary_type: framework
    labels: {zh: 知识组织与本体设计, en: Knowledge Organization and Ontology Design}
    definition: 以身份、类型、关系、层级、分面、来源、版本和映射语义组织知识，使人和机器能检索、比较、推理与演化。
    core_questions: [哪些对象需要稳定身份且关系语义是什么, 分类如何同时支持主路径跨域复用和版本迁移]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:knowledge-organization-ontology]
    roles: [representation, design, synthesis]
    aims: [identify-classify, design-create, learn-transfer]
    epistemic_modes: [formal, design, synthetic]
    learning_priority: S
    prerequisites: [hkm:framework:ontology-identity-modality, hkm:method:argument-analysis-dialectical-inquiry]
    connections: [{type: implements, target: hkm:framework:reflexive-inquiry-worldview-audit, scope: 显式类型边界来源和版本使分类假设可被审计与修正}]
    boundary_notes: 本体是目的约束下的可演化模型而非世界的最终目录；过度细分、混合层级和无语境复用会制造伪精确。

  - <<: *core_defaults
    id: hkm:framework:reflexive-inquiry-worldview-audit
    code: K01.12
    primary_type: framework
    labels: {zh: 反身探究与世界观审计, en: Reflexive Inquiry and Worldview Audit}
    definition: 检视问题设定、价值承诺、知识来源、利益位置、缺席声音和行动后果，形成可重复的自我修正闭环。
    core_questions: [我的框架让哪些事实价值和主体可见或不可见, 什么证据经验或异议会促使我改变立场]
    primary_domain: hkm:domain:metaknowledge-philosophy-inquiry
    related_subdomains: [hkm:subdomain:epistemology-knowledge, hkm:subdomain:value-aesthetics-life-philosophy, hkm:subdomain:comparative-philosophy-knowledge-traditions, hkm:subdomain:metascience-research-integrity]
    roles: [synthesis, method, boundary]
    aims: [evaluate-norm, learn-transfer, decide-negotiate]
    epistemic_modes: [interpretive, comparative, normative, synthetic]
    learning_priority: B
    prerequisites: [hkm:framework:ethical-reasoning-moral-pluralism, hkm:method:comparative-philosophy-contextual-translation, hkm:framework:metascience-reproducibility-incentives]
    connections: [{type: refines, target: hkm:framework:knowledge-justification-truth, scope: 反身审计把个体证成扩展到社会位置制度激励和被排除证言}]
    boundary_notes: 反身性不等于所有观点同样可靠或陷入无限怀疑；审计仍需可检验主张、证据标准与行动责任。

  # D02 数学、统计与形式系统骨架
  - <<: *core_defaults
    id: hkm:framework:formal-objects-axioms-types-categories
    code: K02.01
    primary_type: framework
    labels: {zh: 形式对象、公理、类型与范畴, en: Formal Objects, Axioms, Types and Categories}
    definition: 用集合、关系、结构、类型、映射和范畴刻画形式对象，区分语法规则、语义解释与不同基础体系的承诺。
    core_questions: [对象与合法操作由哪些公理和类型规则规定, 不同基础语言保留了哪些结构与证明]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:foundations-sets-types-categories]
    roles: [foundation, representation, boundary]
    aims: [identify-classify, explain-understand, learn-transfer]
    epistemic_modes: [formal]
    learning_priority: S
    prerequisites: []
    connections: [{type: enables, target: hkm:framework:logic-proof-model-theory, scope: 基础对象和构造规则为命题证明与模型解释提供语言}]
    boundary_notes: 不同基础方案可对大部分日常数学给出等价表达；形式存在与经验世界中的对象存在不可直接等同。

  - <<: *core_defaults
    id: hkm:framework:logic-proof-model-theory
    code: K02.02
    primary_type: framework
    labels: {zh: 逻辑、证明与模型理论, en: Logic, Proof and Model Theory}
    definition: 研究形式语言中的可推导性、有效性、一致性、完备性、可判定性与模型满足关系，连接证明系统和语义结构。
    core_questions: [结论能否从给定公理按规则推出, 语法可证与语义为真之间在何种条件下对应]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:mathematical-logic-proof]
    roles: [foundation, method, boundary]
    aims: [explain-understand, evaluate-norm, learn-transfer]
    epistemic_modes: [formal]
    learning_priority: S
    prerequisites: [hkm:framework:formal-objects-axioms-types-categories]
    connections: [{type: enables, target: hkm:framework:number-arithmetic-structures, scope: 证明和模型工具用于研究数系结构与不可判定边界}]
    boundary_notes: 形式证明保证相对公理和规则的正确性，不保证公理适合经验问题；不完备结果也不意味着任意命题不可知。

  - <<: *core_defaults
    id: hkm:framework:number-arithmetic-structures
    code: K02.03
    primary_type: framework
    labels: {zh: 数与算术结构, en: Number and Arithmetic Structures}
    definition: 从自然数、整数、域、同余、素数与丢番图关系研究离散数量结构及其代数、逻辑和计算性质。
    core_questions: [整数结构中的分解同余和可解性遵循什么规律, 局部信息如何约束全局算术性质]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:number-theory-arithmetic]
    roles: [foundation, mechanism, representation]
    aims: [identify-classify, explain-understand, predict-warn]
    epistemic_modes: [formal]
    learning_priority: A
    prerequisites: [hkm:framework:logic-proof-model-theory]
    connections: [{type: enables, target: hkm:framework:information-coding-cryptographic-structure, scope: 模运算素数和有限域构成编码与现代密码的关键基础}]
    boundary_notes: 理论难解性与工程安全性不同；有限样例中的数值模式不能替代证明。

  - <<: *core_defaults
    id: hkm:framework:algebra-discrete-symmetry
    code: K02.04
    primary_type: framework
    labels: {zh: 代数、离散结构与对称性, en: Algebra, Discrete Structures and Symmetry}
    definition: 用群、环、域、模、图、组合结构和同态研究运算封闭性、不变量、对称变换与离散关系网络。
    core_questions: [哪些运算和变换保持结构, 离散对象如何按同构不变量和组合约束分类]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:algebra-discrete-structures]
    roles: [foundation, representation, synthesis]
    aims: [identify-classify, explain-understand, design-create]
    epistemic_modes: [formal]
    learning_priority: S
    prerequisites: [hkm:framework:formal-objects-axioms-types-categories]
    connections: [{type: enables, target: hkm:framework:geometry-topology-invariants, scope: 代数不变量和变换群用于描述空间结构}]
    boundary_notes: 相同代数形式可实例化为不同现实机制；离散化会舍弃连续空间中的度量与极限信息。

  - <<: *core_defaults
    id: hkm:framework:geometry-topology-invariants
    code: K02.05
    primary_type: framework
    labels: {zh: 几何、拓扑与空间不变量, en: Geometry, Topology and Spatial Invariants}
    definition: 区分距离、角度、曲率、连通性、邻域与洞等在不同变换下保持的空间性质，并研究局部与整体结构。
    core_questions: [允许哪些空间变换且什么量保持不变, 局部几何如何限制或揭示整体拓扑]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:geometry-topology]
    roles: [representation, mechanism, synthesis]
    aims: [describe-measure, identify-classify, explain-understand]
    epistemic_modes: [formal]
    learning_priority: A
    prerequisites: [hkm:framework:algebra-discrete-symmetry]
    connections: [{type: complements, target: hkm:framework:analysis-calculus-differential-equations, scope: 现代空间问题常同时需要拓扑整体约束与局部微分结构}]
    boundary_notes: 可视化直觉在高维、非欧和奇异空间中可能失效；拓扑等价不保留长度、能量或动力学性质。

  - <<: *core_defaults
    id: hkm:framework:analysis-calculus-differential-equations
    code: K02.06
    primary_type: framework
    labels: {zh: 分析、微积分与微分方程, en: Analysis, Calculus and Differential Equations}
    definition: 以极限、连续、导数、积分、函数空间和方程研究连续变化、累积效应、稳定性及初边值条件下的解。
    core_questions: [局部变化率如何积累成整体行为, 方程的解是否存在唯一稳定且对扰动连续]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:analysis-calculus-equations]
    roles: [foundation, mechanism, method]
    aims: [explain-understand, predict-warn, describe-measure]
    epistemic_modes: [formal]
    learning_priority: S
    prerequisites: [hkm:framework:formal-objects-axioms-types-categories]
    connections: [{type: enables, target: hkm:framework:dynamical-systems-control-complexity, scope: 微分和差分方程为状态演化稳定性与控制提供主要表达}]
    boundary_notes: 方程有解不等于可闭式求解或可稳定计算；连续模型对离散事件和奇异点需额外处理。

  - <<: *core_defaults
    id: hkm:framework:probability-stochastic-processes
    code: K02.07
    primary_type: framework
    labels: {zh: 概率与随机过程, en: Probability and Stochastic Processes}
    definition: 用样本空间、随机变量、条件概率、期望、极限定理和随机过程表示不确定事件及其随时间和信息变化的分布。
    core_questions: [不确定性来自随机机制知识不足还是建模选择, 条件信息如何更新事件与路径的概率]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:probability-stochastic-processes]
    roles: [foundation, representation, mechanism]
    aims: [predict-warn, describe-measure, diagnose-abduce]
    epistemic_modes: [formal]
    learning_priority: S
    prerequisites: [hkm:framework:formal-objects-axioms-types-categories]
    connections: [{type: enables, target: hkm:framework:statistical-inference-measurement, scope: 概率模型把数据生成假设与参数不确定性连接起来}]
    boundary_notes: 概率需声明频率、倾向或信念等解释及参考类；低概率不等于不可能，高概率不等于已发生。

  - <<: *core_defaults
    id: hkm:framework:statistical-inference-measurement
    code: K02.08
    primary_type: framework
    additional_types: [measurement]
    labels: {zh: 统计推断、数据生成与测量, en: Statistical Inference, Data Generation and Measurement}
    definition: 将抽样、测量误差、估计、检验、贝叶斯更新、因果识别和模型检验纳入对总体与机制的可校准推断。
    core_questions: [数据由什么选择测量和缺失过程产生, 结论对模型假设先验多重比较与误差多敏感]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:statistics-inference-measurement]
    roles: [evidence, method, boundary]
    aims: [diagnose-abduce, describe-measure, evaluate-norm]
    epistemic_modes: [formal, empirical, causal]
    learning_priority: S
    prerequisites: [hkm:framework:probability-stochastic-processes]
    connections: [{type: constrains, target: hkm:framework:optimization-operations-games, scope: 决策优化需要使用经校准的不确定性估计而非点预测幻觉}]
    boundary_notes: 统计显著性不等于效应重要、因果或可复现；模型外推必须说明总体、干预与测量稳定条件。

  - <<: *core_defaults
    id: hkm:framework:optimization-operations-games
    code: K02.09
    primary_type: framework
    labels: {zh: 优化、运筹与博弈, en: Optimization, Operations Research and Games}
    definition: 在目标、约束、资源、不确定性和多主体策略下寻找可行或近优决策，并分析均衡、激励与机制设计。
    core_questions: [目标函数和约束是否代表真实价值与边界, 多主体反应如何改变单方最优和系统结果]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:optimization-operations-game-theory]
    roles: [decision, design, method]
    aims: [optimize-allocate, decide-negotiate, design-create]
    epistemic_modes: [formal, design]
    learning_priority: A
    prerequisites: [hkm:framework:analysis-calculus-differential-equations, hkm:framework:probability-stochastic-processes]
    connections: [{type: enables, target: hkm:framework:dynamical-systems-control-complexity, scope: 控制策略和资源调度常以动态优化和反馈决策构造}]
    boundary_notes: 可计算最优只相对于编码目标；遗漏公平、安全、鲁棒性和战略操纵会产生形式正确但现实有害的方案。

  - <<: *core_defaults
    id: hkm:framework:dynamical-systems-control-complexity
    code: K02.10
    primary_type: framework
    labels: {zh: 动力系统、控制与复杂性, en: Dynamical Systems, Control and Complexity}
    definition: 以状态空间、反馈、稳定性、吸引子、分岔、混沌和可控可观性研究系统随时间演化及干预边界。
    core_questions: [长期行为由哪些状态反馈与参数区间决定, 系统能否被观测控制并对扰动保持鲁棒]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:dynamical-systems-control]
    roles: [mechanism, representation, design]
    aims: [predict-warn, control-maintain, explain-understand]
    epistemic_modes: [formal, causal]
    learning_priority: A
    prerequisites: [hkm:framework:analysis-calculus-differential-equations, hkm:framework:optimization-operations-games]
    connections: [{type: complements, target: hkm:framework:numerical-computation-approximation-error, scope: 非线性动力系统通常依赖数值模拟但需同时审查误差和敏感性}]
    boundary_notes: 混沌限制长期轨迹预测但不排除统计规律；反馈控制在模型偏差、延迟和执行饱和下可能失稳。

  - <<: *core_defaults
    id: hkm:framework:information-coding-cryptographic-structure
    code: K02.11
    primary_type: framework
    labels: {zh: 信息、编码与密码结构, en: Information, Coding and Cryptographic Structure}
    definition: 用熵、信道、编码、纠错、复杂度与计算困难性研究信息压缩、可靠传输、保密、认证和完整性。
    core_questions: [信源信道和攻击模型允许何种编码上限, 安全主张依赖哪些困难假设密钥和实现条件]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:information-coding-cryptography]
    roles: [representation, design, boundary]
    aims: [describe-measure, design-create, predict-warn]
    epistemic_modes: [formal]
    learning_priority: B
    prerequisites: [hkm:framework:number-arithmetic-structures, hkm:framework:algebra-discrete-symmetry, hkm:framework:probability-stochastic-processes]
    connections: [{type: complements, target: hkm:framework:numerical-computation-approximation-error, scope: 形式编码和密码在实现时仍受有限精度随机源与计算资源约束}]
    boundary_notes: 信息论安全、计算安全与系统安全不同；强算法不能弥补泄漏密钥、恶意终端或错误协议组合。

  - <<: *core_defaults
    id: hkm:framework:numerical-computation-approximation-error
    code: K02.12
    primary_type: framework
    labels: {zh: 数值计算、近似与误差, en: Numerical Computation, Approximation and Error}
    definition: 用离散化、迭代、插值、矩阵计算、条件数和误差传播把数学对象转为有限资源下可执行且可验证的近似。
    core_questions: [算法误差来自截断舍入采样还是模型偏差, 结果是否收敛稳定且在资源限制下可复核]
    primary_domain: hkm:domain:mathematics-statistics-formal-systems
    related_subdomains: [hkm:subdomain:numerical-computational-mathematics]
    roles: [method, evidence, boundary]
    aims: [describe-measure, predict-warn, design-create]
    epistemic_modes: [formal, empirical, design]
    learning_priority: A
    prerequisites: [hkm:framework:analysis-calculus-differential-equations, hkm:framework:algebra-discrete-symmetry]
    connections: [{type: operationalizes, target: hkm:framework:dynamical-systems-control-complexity, scope: 数值算法使复杂动力模型的轨迹稳定性和参数敏感性可计算检验}]
    boundary_notes: 更多小数位不保证更真实；病态问题、网格依赖和未报告容差会产生精确外观下的不可靠结论。

  # D03 自然规律模板
  - <<: *core_defaults
    id: hkm:framework:physical-quantities-dimensional-analysis
    code: K03.01
    primary_type: framework
    additional_types: [measurement]
    labels: {zh: 物理量、单位与量纲分析, en: Physical Quantities, Units and Dimensional Analysis}
    definition: 用可操作量、单位制和量纲关系把观察、方程与尺度比较连接起来的基础表征框架。
    core_questions: [什么被测量且单位如何定义, 方程与估算是否在量纲上自洽]
    primary_domain: hkm:domain:matter-energy-universe
    related_subdomains: [hkm:subdomain:measurement-physical-science]
    roles: [foundation, representation, method]
    aims: [describe-measure, learn-transfer]
    epistemic_modes: [empirical, formal]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:law-principle:conservation-laws-balances, scope: 量纲一致是守恒方程可解释的必要但非充分条件}]
    boundary_notes: 量纲正确不证明模型或因果机制正确；无量纲常数也可能承载关键经验信息。

