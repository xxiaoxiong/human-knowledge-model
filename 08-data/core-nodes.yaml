  # D10 社会制度模板
  - <<: *core_defaults
    id: hkm:concept:scarcity-opportunity-cost-tradeoffs
    code: K10.01
    primary_type: concept
    labels: {zh: 稀缺、机会成本与权衡, en: Scarcity, Opportunity Cost and Trade-offs}
    definition: 以有限资源和互斥选择为起点，比较采取某方案所放弃的最佳替代及其分配后果。
    core_questions: [真正稀缺的资源是什么, 选择该方案放弃了什么且由谁承担]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:public-labor-development-environment-economics, hkm:subdomain:operations-supply-chains-quality]
    roles: [foundation, decision, boundary]
    aims: [optimize-allocate, decide-negotiate, evaluate-norm]
    epistemic_modes: [formal, empirical, normative]
    learning_priority: S
    prerequisites: []
    connections: [{type: constrains, target: hkm:framework:marginal-choice-equilibrium-welfare, scope: 机会成本定义边际比较和可行选择集}]
    boundary_notes: 稀缺不决定分配应当如何；货币价格可能遗漏权力、公共价值、不可逆损害和无偿劳动。

  - <<: *core_defaults
    id: hkm:framework:marginal-choice-equilibrium-welfare
    code: K10.02
    primary_type: framework
    labels: {zh: 边际选择、均衡与福利, en: Marginal Choice, Equilibrium and Welfare}
    definition: 用偏好、边际收益成本、约束和相互一致的选择分析个体行为、市场结果与福利变化。
    core_questions: [在约束下多做一单位的净效果是什么, 个体最优如何形成或不能形成社会可取结果]
    primary_domain: hkm:domain:economy-finance-organizations
    related_subdomains: [hkm:subdomain:microeconomics-markets, hkm:subdomain:behavioral-experimental-economics]
    roles: [foundation, representation, decision]
    aims: [explain-understand, predict-warn, optimize-allocate]
    epistemic_modes: [formal, empirical, normative]
    learning_priority: S
    prerequisites: [hkm:concept:scarcity-opportunity-cost-tradeoffs]
    connections: [{type: depends-on, target: hkm:framework:information-asymmetry-signals, scope: 均衡预测随信息集合和信念结构改变}]
    boundary_notes: 均衡是相容性条件而非道德认可或动态稳定保证；偏好也可能受制度和社会塑造。

